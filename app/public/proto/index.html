<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C3B2E">
<title>OmniOS Dukaan — prototype v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@500;600;700;800&family=Anek+Latin:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Prototype v3 — two colours (bahi green + saffron), Anek type, awning edge + stamp as the identity.
   Numbers are the TEST store's real figures; nothing here saves data. */
:root{
  --g:#0C3B2E; --g2:#145441; --g-50:#EAF2EE; --g-100:#D3E5DC;
  --s:#E9A21A; --s-50:#FDF3DD; --s-ink:#5B3D00;
  --paper:#FFFFFF; --bg:#F5F3EE; --ink:#13201A; --ink2:#33423A; --line:#E4E0D6; --line2:#EEEBE3;
  --ud:#9A4B10; --ud-50:#FBEFE3;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.45,.64,1);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 18px/26px "Anek Latin","Anek Devanagari",system-ui,sans-serif;max-width:440px;margin:0 auto;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
body.hi{font-family:"Anek Devanagari","Anek Latin",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{flex:none}
.p{transition:transform .12s var(--ease),filter .12s}.p:active{transform:scale(.97);filter:brightness(.96)}
::selection{background:var(--s-50)}
:focus-visible{outline:3px solid var(--s);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.view{display:none;min-height:100dvh;padding-bottom:120px}.view.on{display:block}
.view.on .rise{animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.n{font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- header with awning edge ---------- */
.hd{background:var(--g);color:#fff;padding:12px 18px 26px;position:relative}
.hd::after{content:"";position:absolute;left:0;right:0;bottom:-13px;height:14px;
  background:radial-gradient(circle at 13px 0,var(--g) 12.5px,transparent 13px) 0 0/26px 14px repeat-x}
.hd-row{display:flex;align-items:center;gap:12px;min-height:56px}
.mark{width:46px;height:46px;flex:none}
.shop{flex:1;min-width:0}
.shop b{display:block;font-size:22px;line-height:26px;font-weight:800;letter-spacing:-.2px}
.shop span{display:block;font-size:16px;color:#BBD5C8}
.hbtn{min-height:56px;min-width:56px;padding:0 12px;border-radius:14px;border:1.5px solid rgba(255,255,255,.28);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:17px;color:#fff}
.lang{display:flex;gap:4px;margin-top:10px}
.lang button{min-height:40px;padding:0 12px;border-radius:999px;font-size:15px;font-weight:600;color:#BBD5C8}
.lang button.on{background:rgba(255,255,255,.14);color:#fff}

/* ---------- speak first ---------- */
.speak{margin:30px 16px 0;width:calc(100% - 32px);display:flex;align-items:center;gap:16px;background:var(--paper);border-radius:22px;padding:18px;text-align:left;border:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
.mic{width:72px;height:72px;border-radius:50%;background:var(--s);color:var(--g);display:grid;place-items:center;position:relative;flex:none}
.mic::before,.mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--s);animation:ring 2.6s var(--ease) infinite}
.mic::after{animation-delay:1.3s}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.speak b{display:block;font-size:24px;line-height:28px;font-weight:800;color:var(--g)}
.speak small{display:block;font-size:17px;line-height:23px;color:var(--ink2);margin-top:4px}
.speak q{display:block;font-weight:700;color:var(--ink);transition:opacity .25s;quotes:"“" "”"}

/* ---------- money: ledger equation ---------- */
.card{margin:14px 16px 0;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px}
.k{font-size:17px;color:var(--ink2);font-weight:600}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:2px}
.total b{font-size:46px;line-height:50px;font-weight:800;letter-spacing:-1px;color:var(--g)}
.total span{font-size:16px;font-weight:700;color:var(--g2);white-space:nowrap}
.eq{margin-top:14px;border-top:1px solid var(--line2)}
.eq div{display:flex;justify-content:space-between;align-items:center;min-height:46px;border-bottom:1px dashed var(--line2)}
.eq div span{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--ink2);font-weight:600}
.eq div span i{font-style:normal;width:22px;color:var(--ink2);font-weight:700;text-align:center}
.eq div b{font-size:21px}
.eq div.sum{border-bottom:0;border-top:2px solid var(--ink);margin-top:2px}
.eq div.sum span,.eq div.sum b{color:var(--ink);font-weight:800}
.ud{color:var(--ud)!important}

/* ---------- sections ---------- */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 20px 10px}
.sec h3{font-size:22px;font-weight:800;color:var(--g)}
.sec span{font-size:17px;font-weight:700;color:var(--ud)}
.list{margin:0 16px;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.row{padding:14px 18px}
.row+.row{border-top:1px solid var(--line2)}
.rt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rt b{font-size:19px;font-weight:700}.rt .n{font-size:21px}
.rs{font-size:16px;color:var(--ink2);margin-top:2px}
.rb{display:flex;gap:8px;margin-top:10px}
.btn{min-height:56px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px;padding:0 16px}
.btn.wa{flex:1;background:#E7F5EC;color:#0F6B37}
.btn.ln{flex:1;border:1.5px solid var(--line);background:#fff}
.btn.go{background:var(--g);color:#fff}
.todo .row{display:flex;align-items:center;gap:14px}
.todo .row .t{flex:1;min-width:0}
.todo .row .t b{display:block;font-size:19px;line-height:24px}
.todo .btn{flex:none;min-width:104px}

/* ---------- nav ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;height:86px;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 96px 1fr 1fr;padding-bottom:env(safe-area-inset-bottom);z-index:40}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:16px;font-weight:600;color:var(--ink2);position:relative}
.nv.on{color:var(--g);font-weight:800}.nv.on::before{content:"";position:absolute;top:0;width:32px;height:4px;border-radius:0 0 4px 4px;background:var(--s)}
.nmic{width:68px;height:68px;border-radius:50%;background:var(--g);color:var(--s);display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 0 0 6px var(--paper)}
.nml{text-align:center;font-size:16px;font-weight:800;color:var(--g)}
.nav.flow .nv{visibility:hidden}

/* ---------- bill ---------- */
.bhd{background:var(--g);color:#fff;padding:6px 10px 24px;position:relative}
.bhd::after{content:"";position:absolute;left:0;right:0;bottom:-13px;height:14px;background:radial-gradient(circle at 13px 0,var(--g) 12.5px,transparent 13px) 0 0/26px 14px repeat-x}
.bk{min-height:56px;min-width:56px;display:inline-flex;align-items:center;gap:6px;color:#BBD5C8;font-weight:600;padding:0 8px}
.who{display:flex;justify-content:space-between;align-items:flex-end;padding:0 8px;gap:10px}
.who small{display:block;font-size:16px;color:#BBD5C8}.who b{display:block;font-size:26px;line-height:30px;font-weight:800}
.who .due{text-align:right}.who .due b{color:#FFD08A;font-size:24px}
.heard{margin:14px 8px 0;border-radius:16px;background:rgba(255,255,255,.08);padding:12px 14px;font-size:18px;line-height:26px;color:#EAF4EE;min-height:56px}
.heard .w{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--s);margin-bottom:4px;letter-spacing:.3px}
.wave{display:flex;gap:3px;align-items:center;height:20px}.wave i{width:3px;border-radius:2px;background:var(--s);animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.5s}
@keyframes wv{0%,100%{height:5px}50%{height:20px}}
.items{margin:26px 16px 0;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.it{padding:14px 16px;animation:slide .45s var(--spring) both}
.it+.it{border-top:1px solid var(--line2)}
@keyframes slide{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.it .rt b{font-size:20px}.it .rt .n{font-size:22px}
.it .ctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.it .ctl span{font-size:16px;color:var(--ink2)}
.stp{display:flex;align-items:center;height:56px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.stp button{width:56px;height:56px;display:grid;place-items:center;color:var(--g)}
.stp em{min-width:56px;text-align:center;font-style:normal;font-weight:700;font-size:19px}
.ghost{height:96px;margin:0 16px;border-top:1px solid var(--line2);background:linear-gradient(90deg,var(--line2) 25%,#F7F5F0 50%,var(--line2) 75%) 0 0/200% 100%;animation:sh 1.4s linear infinite;opacity:.55}
@keyframes sh{to{background-position:-200% 0}}
.it.ask{background:var(--s-50)}
.askq{margin-top:12px;padding-top:12px;border-top:1px dashed #E7CF8F}
.askq p{font-size:18px;font-weight:700;color:var(--s-ink)}
.askq div{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.o{min-height:56px;border-radius:14px;font-weight:700;font-size:18px;background:#fff;border:1.5px solid #E2C673;color:var(--s-ink)}
.o.y{background:var(--g);border-color:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.billsum{margin:14px 20px 0;display:flex;justify-content:space-between;align-items:baseline}
.billsum span{font-size:18px;color:var(--ink2);font-weight:600}.billsum b{font-size:34px;font-weight:800;color:var(--g)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;background:var(--paper);border-top:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(12,59,46,.10);padding:16px 16px 134px;z-index:30;animation:up .35s var(--ease) both}
@keyframes up{from{transform:translate(-50%,30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.dock .q{font-size:19px;font-weight:800;color:var(--g);margin-bottom:10px}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay{min-height:60px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink2)}
.pay.on{border:2.5px solid var(--g);background:var(--g-50);color:var(--g)}
.pay.u.on{border-color:var(--ud);background:var(--ud-50);color:var(--ud)}
.math{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--ud-50);color:var(--ud);font-weight:700;font-size:18px;display:flex;justify-content:space-between}
.save{margin-top:12px;width:100%;min-height:62px;border-radius:16px;background:var(--s);color:var(--g);font-weight:800;font-size:21px;display:flex;align-items:center;justify-content:center;gap:10px}
.save[disabled]{background:#EEEAE0;color:#6D6A60}
.wait{width:100%;min-height:62px;border-radius:16px;background:var(--s-50);border:1.5px solid #EDD48E;color:var(--s-ink);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px}

/* ---------- saved: receipt + stamp ---------- */
.done-hd{padding:18px 20px 8px;display:flex;align-items:center;justify-content:space-between}
.done-hd b{font-size:26px;font-weight:800;color:var(--g)}
.rcpt{margin:10px 16px 0;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 0 0;padding:18px 18px 22px;position:relative}
.rcpt::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-10px;height:10px;background:radial-gradient(circle at 8px 0,var(--paper) 7px,transparent 7.5px) -1px 0/16px 10px repeat-x}
.rh{text-align:center;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.rh b{display:block;font-size:22px;font-weight:800;color:var(--g)}.rh span{font-size:15px;color:var(--ink2)}
.rl{display:flex;justify-content:space-between;padding:9px 0;font-size:18px}.rl span{color:var(--ink2)}
.rtot{display:flex;justify-content:space-between;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-size:22px;font-weight:800}
.stamp{position:absolute;right:22px;bottom:70px;transform:rotate(-11deg);border:3px solid var(--ud);color:var(--ud);border-radius:10px;padding:6px 12px 4px;text-align:center;font-weight:800;font-size:22px;line-height:24px;background:rgba(251,239,227,.6);animation:stamp .5s var(--spring) both .2s}
.stamp small{display:block;font-size:14px;font-weight:700}
.stamp.cash{border-color:var(--g);color:var(--g);background:rgba(234,242,238,.6)}
@keyframes stamp{0%{opacity:0;transform:rotate(-11deg) scale(2)}70%{opacity:1;transform:rotate(-11deg) scale(.95)}100%{transform:rotate(-11deg) scale(1)}}
.after{margin:26px 16px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.after .btn{width:100%}
.btn.waf{background:#1DA851;color:#fff}
.undo{margin:14px 16px 0;padding:14px 16px;border-radius:16px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;color:var(--ink2)}
.undo .btn{flex:none;border:1.5px solid var(--ink2);color:var(--ink);background:#fff}
.note{margin:26px 16px 0;text-align:center;font-size:14px;color:var(--ink2)}
</style>
</head>
<body>

</svg>

<section class="view on" id="home">
  <header class="hd">
    <div class="hd-row">
      <svg class="mark"><use href="#mark"/></svg>
      <div class="shop"><b>Sharma General Store</b><span data-t="area"></span></div>
      <button class="hbtn p"><svg width="22" height="22"><use href="#i-qr"/></svg>QR</button>
    </div>
    <div class="lang"><button data-l="hinglish">Hinglish</button><button data-l="hi">हिंदी</button><button data-l="en">English</button></div>
  </header>

  <button class="speak p rise" onclick="go('bill')">
    <span class="mic"><svg width="32" height="32"><use href="#i-mic"/></svg></span>
    <span><b data-t="speak"></b><small><span data-t="like"></span> <q id="hint"></q></small></span>
  </button>

  <div class="card rise" style="animation-delay:.05s">
    <div class="k" data-t="today"></div>
    <div class="total"><b class="n" data-count="14218">₹0</b><span data-t="vs"></span></div>
    <div class="eq">
      <div><span><i></i><span data-t="cash"></span></span><b class="n">₹9,642</b></div>
      <div><span><i>+</i><span>UPI</span></span><b class="n">₹3,456</b></div>
      <div><span><i>+</i><span class="ud" data-t="udgiven"></span></span><b class="n ud">₹1,120</b></div>
      <div class="sum"><span><i>=</i><span data-t="total"></span> · <span data-t="bills"></span></span><b class="n">₹14,218</b></div>
    </div>
  </div>

  <div class="sec"><h3 data-t="collect"></h3><span class="n">₹32,484</span></div>
  <div class="list">
    <div class="row"><div class="rt"><b>Mishra ji</b><span class="n ud">₹2,523</span></div><div class="rs" data-t="d5"></div>
      <div class="rb"><button class="btn wa p"><svg width="22" height="22"><use href="#i-wa"/></svg><span data-t="remind"></span></button><button class="btn ln p" data-t="paid"></button></div></div>
    <div class="row"><div class="rt"><b>Sharma ji · gali 4</b><span class="n ud">₹2,416</span></div><div class="rs" data-t="d4"></div>
      <div class="rb"><button class="btn wa p"><svg width="22" height="22"><use href="#i-wa"/></svg><span data-t="remind"></span></button><button class="btn ln p" data-t="paid"></button></div></div>
  </div>

    back:'पीछे', billfor:'बिल किसका', olddue:'पहले का उधार', listening:'सुन रहा हूँ', items3:'3 सामान', confirm:'पहले ऊपर मैगी पक्का करो', how:'पैसा कैसे मिला?', udhaar:'उधार', save0:'पहले पैसे का तरीका चुनो', saveC:'सेव करो · नकद ₹181', saveU:'सेव करो · उधार ₹181', saveP:'सेव करो · UPI ₹181',
    made:'बिल बन गया', rmeta:'बिल नं. 2204 · 23 नव॰, शाम 6:15', i1:'चीनी · 2 किलो', i2:'मैगी छोटा · 1', i3:'तूर दाल · आधा किलो', home:'घर', undonote:'गलती हुई? अगले बिल तक वापस ले सकते हैं', undo:'वापस लो', stU:'उधार में लिखा', stUs:'खाता अब ₹2,597', stC:'पैसा मिला', tHome:'घर', tBill:'बिल', tMaal:'माल', tUd:'उधार', mic:'बोलो', micB:'बोलकर बदलो',
    yes:'हाँ, यही', other:'दूसरी', which:'यही वाली मैगी? (मैगी छोटा, ₹14)', hints:['शर्मा जी, दो किलो चीनी, एक मैगी', 'माल आया, दस आशीर्वाद आटा', 'गुप्ता जी ने 500 दिए'], said:'शर्मा जी, दो किलो चीनी, एक मैगी, आधा किलो तूर दाल', names:['चीनी','मैगी छोटा?','तूर दाल'], units:['2 किलो × ₹46','1 × ₹14','आधा किलो × ₹150'] },
  en: { area:'Grocery · Rajwada, Indore', speak:'Speak to make a bill', like:'Like:', today:"Today's sales · till 6:14 pm", vs:'₹1,050 more than yesterday', cash:'Cash', udgiven:'Udhaar given', total:'Total', bills:'68 bills', collect:'Money to collect', d5:'Due 5 days', d4:'Due 4 days', remind:'Remind', paid:'Got paid', todo:"Today's tasks", t1:'2 new online orders', t1s:'Pack and mark ready', t2:'Matchbox, Frooti running out', t2s:'1–2 days of stock left', t3:'Count 3 items today', t3s:'1 minute · 23-day streak', see:'View', order:'Order', start:'Start', note:'Prototype v3 · TEST store numbers · nothing is saved',

    yes:'Yes, this', other:'Other', which:'This Maggi? (Maggi small, ₹14)', hints:['Sharma ji, 2 kilo sugar, 1 Maggi', 'Stock came, 10 Aashirvaad atta', 'Gupta ji paid 500'], said:'Sharma ji, two kilo sugar, one Maggi, half kilo toor dal', names:['Sugar','Maggi small?','Toor dal'], units:['2 kg × ₹46','1 × ₹14','½ kg × ₹150'] },
}
let L = new URLSearchParams(location.search).get('lang') || 'hinglish', view = 'home', pay = null, open = true
const $ = (s) => document.querySelector(s), wait = (ms) => new Promise((r) => setTimeout(r, ms)), fmt = (n) => '₹' + Math.round(n).toLocaleString('en-IN')
function paint(){ const D = T[L]; document.body.classList.toggle('hi', L === 'hi')
  document.querySelectorAll('[data-t]').forEach((el) => { const v = D[el.dataset.t]; if (typeof v === 'string') el.textContent = v })
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === L)); $('#hint').textContent = D.hints[0]; $('#nml').textContent = view === 'home' ? D.mic : D.micB; state() }
document.querySelectorAll('.lang button').forEach((b) => b.onclick = () => { L = b.dataset.l; paint() })
function countUp(){ document.querySelectorAll('[data-count]').forEach((el) => { const to = +el.dataset.count, t0 = performance.now(); const f = (t) => { const p = Math.min(1, (t - t0) / 900); el.textContent = fmt(to * (1 - Math.pow(1 - p, 4))); if (p < 1) requestAnimationFrame(f) }; requestAnimationFrame(f) }) }
let hn = 0; setInterval(() => { const q = $('#hint'); q.style.opacity = 0; setTimeout(() => { hn = (hn + 1) % 3; q.textContent = T[L].hints[hn]; q.style.opacity = 1 }, 250) }, 3200)
function go(v){ view = v; document.querySelectorAll('.view').forEach((x) => x.classList.toggle('on', x.id === v)); scrollTo(0, 0); $('#nav').classList.toggle('flow', v !== 'home'); paint(); if (v === 'home') countUp(); if (v === 'bill') listen() }
const AMT = [92, 14, 75]
function item(i){ const D = T[L], ask = i === 1; return `<div class="it${ask ? ' ask' : ''}"><div class="rt"><b>${D.names[i]}</b><span class="n">₹${AMT[i]}</span></div>
  <div class="ctl"><span>${D.units[i]}</span><div class="stp"><button aria-label="-"><svg width="20" height="20"><use href="#i-minus"/></svg></button><em>${['2 kg','1','½ kg'][i]}</em><button aria-label="+"><svg width="20" height="20"><use href="#i-plus"/></svg></button></div></div>
  ${ask ? `<div class="askq"><p>${D.which}</p><div><button class="o p">${D.other}</button><button class="o y p" onclick="ok(this)"><svg width="20" height="20"><use href="#i-check"/></svg>${D.yes}</button></div></div>` : ''}</div>` }
async function listen(){ pay = null; open = true; $('#items').innerHTML = ''; $('#ghosts').style.display = ''; $('#bsum').style.visibility = 'hidden'; $('#dock').style.display = 'none'; $('#htxt').textContent = ''; $('#cname').textContent = '…'; $('#cdue').style.opacity = 0
  document.querySelectorAll('.pay').forEach((x) => x.classList.remove('on'))
  const w = T[L].said.split(' ')
  for (let i = 0; i < w.length; i++) { await wait(230); $('#htxt').textContent += (i ? ' ' : '') + w[i]
    if (i === 1) { $('#cname').textContent = L === 'hi' ? 'शर्मा जी · गली 4' : 'Sharma ji · gali 4'; $('#cdue').style.transition = 'opacity .3s'; $('#cdue').style.opacity = 1 }
    if (i === 4) add(0); if (i === 6) add(1); if (i === 10) add(2) }
  await wait(400); $('#ghosts').style.display = 'none'; $('#bsum').style.visibility = 'visible'; $('#dock').style.display = 'block'; state() }
function add(i){ $('#items').insertAdjacentHTML('beforeend', item(i)); const g = $('#ghosts .ghost'); if (g && i === 2) g.remove() }
function ok(b){ const it = b.closest('.it'); it.classList.remove('ask'); it.querySelector('.askq').remove(); it.querySelector('b').textContent = T[L].names[1].replace('?', ''); open = false; state() }
function state(){ const D = T[L]; if (!$('#wait')) return; $('#wait').style.display = open ? 'flex' : 'none'; $('#payw').style.display = open ? 'none' : 'block'; $('#save').disabled = !pay
  $('#savet').textContent = !pay ? D.save0 : pay === 'ud' ? D.saveU : pay === 'upi' ? D.saveP : D.saveC; $('#math').style.display = pay === 'ud' ? 'flex' : 'none' }
document.querySelectorAll('.pay').forEach((b) => b.onclick = () => { pay = b.dataset.p; document.querySelectorAll('.pay').forEach((x) => x.classList.toggle('on', x === b)); state() })
function saved(){ const D = T[L], st = $('#stamp'); st.className = 'stamp' + (pay === 'ud' ? '' : ' cash'); st.innerHTML = pay === 'ud' ? `${D.stU}<small>${D.stUs}</small>` : `${D.stC}<small>${pay === 'upi' ? 'UPI' : D.cash} · ₹181</small>`
  if (navigator.vibrate) navigator.vibrate(25); go('done') }
paint(); countUp()
</script>
