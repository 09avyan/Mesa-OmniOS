<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5BE1E">
<title>OmniOS Dukaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Redo #4 · v2 "MRP box": the language of the packets on every kirana shelf.
   Haldi-yellow packet field with a crimped seal edge, money set inside ruled MRP boxes with the Indian "/-",
   Baloo 2 for figures + headings, Mukta for reading. Controls stay plain and standard. */
:root{
  --y:#F5BE1E; --y2:#E9AE0A; --y-50:#FFF5D3; --y-ink:#3B2C00;
  --ink:#17130A; --ink2:#3A3428; --mute:#625B4C; --line:#E3E0D8; --line2:#EEECE6;
  --bg:#F4F4F1; --paper:#FFFFFF;
  --gr:#0F6B3C; --ud:#7A4207; --ud-50:#FBEEDC; --red:#B3261E;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:500 18px/26px "Mukta",system-ui,sans-serif;max-width:440px;margin:0 auto;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{flex:none}
::selection{background:var(--y);color:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:12px}
.p{transition:transform .12s var(--ease),background-color .15s,border-color .15s}.p:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.fig{font-family:"Baloo 2",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.fig .s{font-size:.55em;font-weight:700;margin-left:1px}
.view{display:none;padding-bottom:110px}.view.on{display:block}

/* ---------- packet field with crimped seal ---------- */
.field{background:var(--y);position:relative;padding:8px 16px 26px}
.field::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;background:linear-gradient(135deg,var(--y) 50%,transparent 50%) 0 0/10px 10px repeat-x,linear-gradient(225deg,var(--y) 50%,transparent 50%) 0 0/10px 10px repeat-x}
.bar{display:flex;align-items:center;gap:8px;min-height:60px}
.shop{flex:1;min-width:0}
.shop b{display:block;font-family:"Baloo 2";font-weight:800;font-size:24px;line-height:28px;padding-top:4px}
.shop span{display:block;font-size:17px;line-height:22px;color:var(--y-ink)}
.tool{min-height:56px;min-width:58px;padding:2px 8px 0;border-radius:14px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;line-height:20px;font-weight:700;color:var(--ink)}
.tool:active{background:rgba(23,19,10,.08)}

/* ---------- signature: the MRP box ---------- */
.mrp{border:2px solid var(--ink);border-radius:14px;margin-top:10px;background:rgba(255,255,255,.22)}
.mrp-top{padding:10px 14px 8px}
.mrp-top small{display:flex;justify-content:space-between;font-size:17px;line-height:22px;font-weight:700;color:var(--y-ink)}
.mrp-top .amt{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mrp-top .amt b{font-size:56px;line-height:62px}
.mrp-top .amt span{font-size:19px;font-weight:700}
.cols{display:grid;grid-template-columns:repeat(3,1fr);border-top:1.5px solid var(--ink)}
.cols div{padding:8px 12px 10px}
.cols div+div{border-left:1.5px solid var(--ink)}
.cols small{display:block;font-size:17px;line-height:22px;font-weight:700;color:var(--y-ink)}
.cols b{display:block;font-size:26px;line-height:30px}
.cols .u small,.cols .u b{color:var(--ud)}
.line{margin-top:12px;font-size:18px;font-weight:600;color:var(--ink)}
.line b{font-weight:800}

/* ---------- work list ---------- */
.sec{margin:36px 18px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-family:"Baloo 2";font-size:24px;line-height:30px;font-weight:800}
.sec span{font-size:17px;color:var(--mute);font-weight:600}
.card{margin:0 14px;background:var(--paper);border-radius:20px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;min-height:80px}
.row+.row{border-top:1px solid var(--line2)}
.row>svg{color:var(--ink)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:19px;line-height:25px;font-weight:700}
.row .t span{display:block;font-size:17px;line-height:22px;color:var(--ink2);margin-top:2px}
.row .t .ud{color:var(--ud);font-weight:700}
.cnt{min-width:44px;height:44px;border:2px solid var(--ink);border-radius:10px;display:grid;place-items:center;font-size:22px;background:var(--y)}
.btn{min-height:56px;padding:0 16px;border-radius:14px;font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none}
.btn.dark{background:var(--ink);color:#fff}
.btn.wa{background:var(--gr);color:#fff}
.btn.out{border:1.5px solid #CFCBC0;background:#fff;color:var(--ink)}

/* ---------- bottom bar: tabs + speak ---------- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;height:88px;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 108px 1fr 1fr;align-items:center;padding:0 4px env(safe-area-inset-bottom);z-index:40}
.tab{height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:17px;line-height:20px;font-weight:600;color:var(--mute)}
.tab.on{color:var(--ink);font-weight:800}
.speak{height:68px;border-radius:18px;background:var(--y);border:2px solid var(--ink);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;line-height:20px;font-weight:800;margin:0 4px}
.nav.flow .tab{visibility:hidden}

/* ---------- bill ---------- */
.bt{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 0}
.back{min-height:56px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;font-weight:700}
.no{font-size:17px;font-weight:700;color:var(--mute);padding-right:8px}
.no b{color:var(--red);font-family:"Baloo 2";font-weight:700;font-size:19px}
.heard{margin:8px 14px 0;border-radius:20px;background:var(--y-50);border:1.5px solid #EED27A;padding:12px 16px 14px}
.heard .h{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:var(--y-ink)}
.heard .h i{width:10px;height:10px;border-radius:50%;background:var(--y2);animation:pl 1.1s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.5);opacity:.5}}
.heard.done .h i{animation:none;background:var(--gr)}
.heard p{font-size:21px;line-height:30px;font-weight:600;margin-top:4px;color:var(--ink)}
.heard p mark{background:linear-gradient(transparent 55%,var(--y) 55%);color:inherit;padding:0 1px}
.cust{margin:12px 14px 0;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;background:var(--paper);border:1px solid var(--line);border-radius:20px;opacity:0;transition:opacity .3s}
.cust.on{opacity:1}
.cust .t{flex:1}.cust b{display:block;font-size:20px;line-height:26px;font-weight:800}.cust span{display:block;font-size:17px;line-height:22px;color:var(--ud);font-weight:700}
.items{margin:12px 14px 0;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.items .empty{padding:18px 16px;font-size:18px;color:var(--mute)}
.it{padding:12px 14px 12px 16px;animation:in .35s var(--ease) both}
.it+.it{border-top:1px solid var(--line2)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.it .a{display:flex;justify-content:space-between;align-items:baseline}
.it .a b{font-size:20px;line-height:26px;font-weight:700}
.it .a .fig{font-size:24px}
.it .c{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.it .c span{font-size:17px;color:var(--ink2)}
.stp{display:flex;align-items:center;height:56px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.stp button{width:56px;height:54px;display:grid;place-items:center}
.stp em{min-width:62px;text-align:center;font-style:normal;font-weight:700;font-size:19px}
.it.q{background:var(--y-50)}
.ask{margin-top:10px;padding-top:10px;border-top:1.5px dashed #E5C35A}
.ask p{font-size:18px;font-weight:700;color:var(--y-ink)}
.ask div{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ask button{min-height:56px;border-radius:14px;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid #D9B648;background:#fff}
.ask button.y{background:var(--ink);border-color:var(--ink);color:#fff}
.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--paper);border-top:1.5px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -10px 26px -16px rgba(23,19,10,.35);padding:12px 14px 100px;z-index:30;display:none}
.dock.on{display:block;animation:up .3s var(--ease) both}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.dtot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dtot span{font-size:18px;font-weight:700;color:var(--ink2)}
.tbox{border:2px solid var(--ink);border-radius:12px;padding:0 12px;display:flex;align-items:baseline;gap:8px}
.tbox small{font-size:17px;font-weight:700;color:var(--mute)}
.tbox b{font-size:34px;line-height:46px}
.why{margin-top:10px;width:100%;min-height:58px;border-radius:14px;background:var(--y-50);border:1.5px solid #E5C35A;color:var(--y-ink);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pay{height:76px;border-radius:16px;border:1.5px solid #CFCBC0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:18px;line-height:22px}
.pay.on{border:2.5px solid var(--ink);background:var(--y)}
.pay.u.on{background:var(--ud-50);border-color:var(--ud);color:var(--ud)}
.math{margin-top:8px;padding:8px 14px;border-radius:12px;background:var(--ud-50);color:var(--ud);font-weight:700;font-size:18px;display:flex;justify-content:space-between}
.save{margin-top:10px;width:100%;min-height:62px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px}
.save[disabled]{background:#E7E5DF;color:#5E584B}

/* ---------- saved ---------- */
.ok{display:flex;align-items:center;gap:14px;padding:8px 2px 4px}
.ok i{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--y);display:grid;place-items:center}
.ok b{display:block;font-family:"Baloo 2";font-size:26px;line-height:30px;font-weight:800;padding-top:4px}
.ok span{display:block;font-size:18px;color:var(--y-ink);font-weight:600}
.slip{position:relative;margin:30px 18px 0;background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0;padding:16px 18px 20px}
.slip::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-10px;height:10px;background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/12px 10px repeat-x,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/12px 10px repeat-x}
.sh{text-align:center;padding-bottom:10px;border-bottom:1.5px dashed var(--line)}
.sh b{display:block;font-family:"Baloo 2";font-size:22px;line-height:28px;font-weight:800}
.sh span{font-size:17px;color:var(--ink2)}
.sl{display:flex;justify-content:space-between;font-size:18px;line-height:34px}
.sl span{color:var(--ink2)}.sl .fig{font-size:20px}
.sl.who{padding-top:8px;font-weight:700}.sl.who span{color:var(--ink)}
.stot{display:flex;justify-content:flex-end;margin-top:10px}
.stamp{position:absolute;left:18px;bottom:78px;transform:rotate(-8deg);border:2.5px solid var(--ud);color:var(--ud);border-radius:10px;padding:4px 10px 2px;font-family:"Baloo 2";font-weight:800;font-size:19px;line-height:22px;text-align:center;animation:st .45s var(--ease) both .2s}
.stamp small{display:block;font-family:"Mukta";font-size:17px;font-weight:700}
.stamp.c{border-color:var(--gr);color:var(--gr)}
@keyframes st{0%{opacity:0;transform:rotate(-8deg) scale(1.6)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
.acts{margin:30px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn{width:100%;min-height:60px;padding:0 10px;white-space:nowrap}
.undo{margin:12px 14px 0;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;background:var(--paper);border:1px solid var(--line);border-radius:18px;font-size:17px;line-height:22px;color:var(--ink2)}
.undo span{flex:1}
.note{margin:28px 18px 0;text-align:center;font-size:17px;color:var(--mute)}
body.hi .fig{letter-spacing:0}
body.hi .shop b,body.hi .sec h2,body.hi .ok b{line-height:1.35}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></symbol>
  <symbol id="qr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="bill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h14v20l-3.5-2-3.5 2-3.5-2L5 22z"/><path d="M9 7h6M9 11h6M9 15h3"/></symbol>
  <symbol id="box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
  <symbol id="book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 0 1 3 3v14H7a3 3 0 0 1-3-3z"/><path d="M18 21h2V6M8 9h6M8 13h4"/></symbol>
  <symbol id="bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 14H5z"/><path d="M9 7a3 3 0 0 1 6 0"/></symbol>
  <symbol id="count" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="low" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><rect x="5" y="14" width="3" height="6"/><rect x="10.5" y="10" width="3" height="10"/><path d="M16 6l3 3m0-3-3 3"/></symbol>
  <symbol id="wa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></symbol>
  <symbol id="back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></symbol>
  <symbol id="minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></symbol>
  <symbol id="up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  <symbol id="note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></symbol>
</svg>

<!-- ================= HOME ================= -->
<section class="view on" id="home">
  <div class="field">
    <div class="bar">
      <div class="shop"><b data-t="shop"></b><span data-t="area"></span></div>
      <button class="tool p"><svg width="24" height="24"><use href="#qr"/></svg>QR</button>
      <button class="tool p"><svg width="24" height="24"><use href="#gear"/></svg><span data-t="set"></span></button>
    </div>
    <div class="mrp">
      <div class="mrp-top">
        <small><span data-t="sold"></span><span data-t="date"></span></small>
        <div class="amt"><b class="fig">₹14,218<span class="s">/-</span></b><span data-t="bills"></span></div>
      </div>
      <div class="cols">
        <div><small data-t="cash"></small><b class="fig">₹9,642</b></div>
        <div><small>UPI</small><b class="fig">₹3,456</b></div>
        <div class="u"><small data-t="udg"></small><b class="fig">₹1,120</b></div>
      </div>
    </div>
    <p class="line"><b data-t="streakn"></b> <span data-t="streak"></span></p>
  </div>

  <div class="sec"><h2 data-t="todo"></h2><span data-t="todon"></span></div>
  <div class="card">
    <div class="row"><svg width="26" height="26"><use href="#bag"/></svg><div class="t"><b data-t="o1"></b><span data-t="o1s"></span></div><span class="cnt fig">2</span></div>
    <div class="row"><svg width="26" height="26"><use href="#book"/></svg><div class="t"><b data-t="u1"></b><span class="ud" data-t="u1s"></span></div><button class="btn wa p"><svg width="20" height="20"><use href="#wa"/></svg><span data-t="remind"></span></button></div>
    <div class="row"><svg width="26" height="26"><use href="#low"/></svg><div class="t"><b data-t="l1"></b><span data-t="l1s"></span></div><button class="btn out p" data-t="order"></button></div>
    <div class="row"><svg width="26" height="26"><use href="#count"/></svg><div class="t"><b data-t="c1"></b><span data-t="c1s"></span></div><button class="btn dark p" data-t="start"></button></div>
  </div>
  <p class="note" data-t="note"></p>
</section>

<!-- ================= BILL ================= -->
<section class="view" id="billv">
  <div class="bt"><button class="back p" onclick="go('home')"><svg width="22" height="22"><use href="#back"/></svg><span data-t="back"></span></button><span class="no"><span data-t="billno"></span> <b>2205</b></span></div>
  <div class="heard" id="heard"><div class="h"><i></i><span id="hl"></span></div><p id="htxt"></p></div>
  <div class="cust" id="cust"><div class="t"><b data-t="sharma"></b><span data-t="old"></span></div><button class="btn out p" data-t="change"></button></div>
  <div class="items" id="items"></div>
  <div class="dock" id="dock">
    <div class="dtot"><span data-t="items3"></span><span class="tbox"><small id="lag" data-t="about"></small><b class="fig">₹181<span class="s">/-</span></b></span></div>
    <button class="why p" id="why" onclick="document.querySelector('.it.q')?.scrollIntoView({behavior:'smooth',block:'center'})"><svg width="20" height="20"><use href="#up"/></svg><span data-t="why"></span></button>
