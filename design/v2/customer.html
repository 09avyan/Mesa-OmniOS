<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dukaan Customer v2</title><link rel="stylesheet" href="base.css">
<style>
body{width:390px;height:844px;overflow:hidden;position:relative}
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font:700 15px/1 var(--font)}
.sb i{display:inline-flex;gap:5px;align-items:center}.sb i b{display:inline-block;width:18px;height:10px;border:1.5px solid var(--ink);border-radius:3px;position:relative}.sb i b::after{content:"";position:absolute;inset:1.5px 4px 1.5px 1.5px;background:var(--ink);border-radius:1px}
.top{height:60px;display:flex;align-items:center;gap:12px;padding:0 16px}
.top h1{font:700 20px/26px var(--font);flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--ink)}
.ib.b{background:var(--s);box-shadow:inset 0 0 0 1px var(--line)}
.pad{padding:0 16px}
.card{background:var(--s);border-radius:20px;box-shadow:inset 0 0 0 1px var(--line)}
.lab{font:600 18px/24px var(--font);color:var(--ink2)}
.h2{font:700 20px/26px var(--font);letter-spacing:-.01em}
.big{font:800 52px/56px var(--font);letter-spacing:-.035em}
.mid{font:800 32px/36px var(--font);letter-spacing:-.025em}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:72px}
.row+.row{box-shadow:inset 0 1px 0 var(--line)}
.row .t{flex:1;min-width:0}.row .t b{display:block;font:700 19px/24px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t span{display:block;font:500 18px/24px var(--font);color:var(--ink2)}
.row .a{font:700 20px/24px var(--font);text-align:right;white-space:nowrap}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s2);font:700 18px/1 var(--font);flex:none;color:var(--ink)}
.btn{min-height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 20px/24px var(--font);padding:0 20px}
.btn.p{background:var(--ac);color:var(--on-ac)}.btn.o{background:var(--s);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.s{min-height:56px;font-size:19px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font:600 18px/1 var(--font);background:var(--s2);color:var(--ink2);white-space:nowrap}
.chip.ud{background:var(--udsoft);color:var(--ud)}.chip.ok{background:var(--oksoft);color:var(--ok)}.chip.v{background:var(--vsoft);color:var(--vt)}
.seg{display:flex;gap:8px;padding:0 16px;overflow:hidden}.seg span{height:44px;padding:0 16px;border-radius:12px;display:flex;align-items:center;font:600 18px/1 var(--font);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);background:var(--s);white-space:nowrap}.seg span.on{background:var(--ac);color:var(--on-ac);box-shadow:none}
/* bottom */
.band{position:absolute;left:0;right:0;bottom:0;height:84px;padding-bottom:20px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);box-shadow:0 -1px 0 var(--line)}
.band a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 18px/22px var(--font);color:var(--ink3);position:relative}.band a.on{color:var(--ink)}.band a.on::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.bolo{position:absolute;left:16px;right:16px;bottom:96px;height:68px;border-radius:20px;background:var(--vf);color:#fff;display:flex;align-items:center;gap:14px;padding:0 10px 0 22px;box-shadow:0 8px 24px -8px rgba(13,92,85,.45)}
.bolo b{font:700 21px/24px var(--font);flex:1}.bolo .m{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.fade{position:absolute;left:0;right:0;bottom:84px;height:110px;background:linear-gradient(transparent,var(--bg) 45%)}
.foot{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 30px;background:var(--bg);box-shadow:0 -1px 0 var(--line)}
.wave{display:flex;align-items:center;gap:5px;height:56px}.wave i{width:6px;border-radius:3px;background:currentColor}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.k button{height:72px;border-radius:18px;background:var(--s);box-shadow:inset 0 0 0 1px var(--line);font:700 28px/1 var(--font);display:grid;place-items:center}
.bar{display:flex;align-items:flex-end;gap:10px;height:150px}.bar div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}.bar i{width:100%;border-radius:8px 8px 3px 3px;background:var(--line2)}.bar i.on{background:var(--ink)}.bar span{font:600 18px/1 var(--font);color:var(--ink3)}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:44px;height:44px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line2);display:grid;place-items:center}.qty b{min-width:44px;text-align:center;font:700 20px/1 var(--font)}

.row:has(.qty){flex-wrap:wrap;row-gap:8px}.row:has(.qty) .t{flex:1 1 200px}.row:has(.qty) .qty{order:3;flex-basis:100%}.row:has(.qty) .a{min-width:0!important}
hr{border:0;height:1px;background:var(--line)}
</style></head><body><div id="app"></div>
<script src="icons.js"></script><script>
const SB=`<div class="sb"><span>9:41</span><i><b></b></i></div>`;
const items=[['Maggi Masala 70g','2 × ₹14',28],['Toor Dal 1kg','1 × ₹168',168],['Cheeni 1kg','2 × ₹46',92],['Amul Taaza 500ml','2 × ₹28',56]];
const shop=`<div class="top" style="padding-left:20px"><span class="av" style="background:var(--ink);color:var(--bg)">SG</span><span style="flex:1"><b style="display:block;font:700 19px/24px var(--font)">Sharma General Store</b><span class="lab">Lajpat Nagar, Delhi</span></span><button class="ib b">${I('phone')}</button></div>`;
const kv=(a,b,c='')=>`<div style="display:flex;justify-content:space-between;padding:10px 0"><span class="lab">${a}</span><b class="${c}" style="font:700 19px/24px var(--font)">${b}</b></div>`;
const powered=`<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px" class="lab">${LOGO(22)}OmniOS Dukaan</div>`;
const S={
ebill:()=>`${SB}${shop}<div class="pad"><div class="card" style="padding:22px 20px"><div style="text-align:center"><span class="chip ok">${I('check')}Paid · UPI</span><div class="big" style="margin:12px 0 2px">₹344</div><div class="lab">Bill #1042 · 25 Nov, 10:42</div></div>
<div style="border-top:1px dashed var(--line2);margin:18px 0 6px"></div>${items.map(([n,q,a])=>`<div style="display:flex;justify-content:space-between;padding:8px 0"><span><b style="display:block;font:600 19px/24px var(--font)">${n}</b><span class="lab">${q}</span></span><b style="font:700 19px/24px var(--font)">₹${a}</b></div>`).join('')}
<div style="border-top:1px dashed var(--line2);margin:8px 0 4px"></div>${kv('Customer','Sharma ji')}${kv('Total','₹344')}</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><button class="btn o s">${I('download')}PDF</button><button class="btn p s">${I('book')}Mera khata</button></div>${powered}</div>`,
khata:()=>`${SB}${shop}<div class="pad"><div class="card" style="padding:22px 20px"><div class="lab">Sharma ji, aapka baaki</div><div class="big ud" style="margin:6px 0">₹2,416</div><div class="lab">25 Nov 2026 tak</div>
<button class="btn p" style="width:100%;margin-top:18px">${I('qr')}UPI se chukao</button></div>
<div class="lab" style="margin:18px 4px 8px">Hisaab</div><div class="card">${[['Bill #1042','25 Nov','+ ₹344','ud'],['Jama · UPI','14 Nov','− ₹1,000',''],['Bill #0987','12 Nov','+ ₹1,268','ud'],['Bill #0921','8 Nov','+ ₹804','ud']].map(([n,s,v,c])=>`<div class="row"><span class="t"><b>${n}</b><span>${s}</span></span><span class="a ${c}">${v}</span></div>`).join('')}</div>${powered}</div>`,
store:()=>`${SB}${shop}<div class="pad"><div class="card" style="display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;color:var(--ink2)">${I('search')}Maggi, dal, doodh…</div></div>
<div class="seg" style="margin-top:12px"><span class="on">Sab</span><span>Atta, dal</span><span>Snacks</span><span>Doodh</span></div>
<div class="pad" style="margin-top:12px"><div class="card">${[['Maggi Masala 70g','₹14',2],['Toor Dal 1kg','₹168',1],['Cheeni 1kg','₹46',0],['Parle-G 250g','₹25',0],['Amul Taaza 500ml','₹28',0,1]].map(([n,p,q,o])=>`<div class="row"><span class="av" style="border-radius:12px;width:52px;height:52px">${I('bag')}</span><span class="t"><b>${n}</b><span>${o?'Abhi khatam':p}</span></span>${o?'':q?`<div class="qty"><button>${I('minus')}</button><b>${q}</b><button>${I('plus')}</button></div>`:`<button class="btn o s" style="min-height:48px;padding:0 14px">${I('plus')}Add</button>`}</div>`).join('')}</div></div>
<div class="foot"><button class="btn p" style="width:100%;justify-content:space-between"><span style="display:flex;gap:10px;align-items:center">${I('bag')}3 items · ₹196</span><span style="display:flex;gap:6px;align-items:center">Order karo${I('chevR')}</span></button></div>`,
order:()=>`${SB}${shop}<div class="pad"><div class="card" style="padding:22px 20px"><div class="lab">Order #O-318 · ₹612</div><div class="mid" style="margin:6px 0 18px">Pack ho raha hai</div>
${[['Order mila','10:12',2],['Pack ho raha','10:20',1],['Raste mein','',0],['Pahunch gaya','',0]].map(([t,s,st],i,a)=>`<div style="display:flex;gap:14px"><div style="display:flex;flex-direction:column;align-items:center"><span style="width:28px;height:28px;border-radius:50%;display:grid;place-items:center;${st==2?'background:var(--ink);color:var(--bg)':st==1?'box-shadow:inset 0 0 0 2px var(--ink)':'box-shadow:inset 0 0 0 1.5px var(--line2)'}">${st==2?I('check'):st==1?'<i style="width:10px;height:10px;border-radius:50%;background:var(--ink)"></i>':''}</span>${i<a.length-1?`<i style="width:2px;flex:1;min-height:26px;background:${st==2?'var(--ink)':'var(--line2)'}"></i>`:''}</div><div style="padding-bottom:16px;display:flex;justify-content:space-between;flex:1"><b style="font:${st?700:500} 19px/28px var(--font);color:${st?'var(--ink)':'var(--ink3)'}">${t}</b><span class="lab">${s}</span></div></div>`).join('')}</div>
<div class="card" style="padding:6px 20px;margin-top:12px">${kv('Items','6')}${kv('Delivery','B-14, Lajpat Nagar')}${kv('Payment','Delivery pe')}</div>
<button class="btn o s" style="width:100%;margin-top:12px">${I('phone')}Dukaan ko call karo</button></div>`};
document.getElementById('app').innerHTML=(S[Q.get('s')]||S.ebill)();
</script></body></html>
