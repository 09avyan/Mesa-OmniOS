<style>
/* bill line: name | amount, then unit price | stepper (stepper sits under the amount, right side) */
.it{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:4px;align-items:center;padding:12px 16px}
.it+.it{box-shadow:inset 0 1px 0 var(--line)}
.it>b{font:700 20px/28px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it>.a{font:700 20px/28px var(--font);text-align:right}
.it>span{color:var(--ink2);white-space:nowrap}.it>.qty{justify-self:end}
.it.q{background:color-mix(in srgb,var(--vsoft) 64%,var(--s))}
.it.q .ask{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:8px}.it.q .ask b{flex:1;font:700 20px/24px var(--font)}
.tile{height:112px;border-radius:var(--r3);background:var(--s);box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:700 20px/24px var(--font);transition:transform .12s,background .12s}
.tile:active{transform:scale(.97);background:var(--s2)}
.split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);padding-top:16px}
.split>div+div{padding-left:16px;border-left:1px solid var(--line)}.split b{display:block;font:700 20px/28px var(--font);white-space:nowrap}
.bar{display:flex;align-items:flex-end;gap:8px;height:152px}.bar div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}.bar i{width:100%;border-radius:var(--r1) var(--r1) 4px 4px;background:var(--line2)}.bar i.on{background:var(--ink)}.bar span{font:600 18px/1 var(--font);color:var(--ink3)}
.banner{display:flex;align-items:center;gap:12px;margin:0 16px 12px;padding:12px 16px;border-radius:var(--r2);background:var(--s2);min-height:64px}
.banner b{display:block;font:700 18px/24px var(--font)}.banner span{display:block;font:500 18px/24px var(--font);color:var(--ink2)}
.empty{position:absolute;left:24px;right:24px;top:236px;text-align:center;display:grid;justify-items:center}
.empty h2{font:800 24px/32px var(--font);letter-spacing:-.015em;margin-top:24px}.empty p{color:var(--ink2);margin-top:8px;max-width:300px}
.say{margin-top:24px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;height:56px;border-radius:var(--r2);background:var(--vsoft);color:var(--vt);font:600 18px/1 var(--font)}
.ask-in{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;min-height:72px}
.ask-in .m{width:48px;height:48px;border-radius:var(--r2);background:var(--vsoft);color:var(--vt);display:grid;place-items:center;flex:none}
.ask-in .t b{display:block;font:700 20px/28px var(--font)}.ask-in .t span{display:block;color:var(--ink2);font:500 18px/24px var(--font)}
.fu{display:flex;gap:8px;flex-wrap:wrap}.fu button{height:56px;padding:0 16px;border-radius:var(--r2);background:var(--s);box-shadow:inset 0 0 0 1.5px var(--line2);font:600 18px/1 var(--font)}
.bubble{background:var(--s2);border-radius:var(--r3) var(--r3) 4px var(--r3);padding:12px 16px;font:600 20px/28px var(--font)}
</style></head><body><div id="app"></div>
