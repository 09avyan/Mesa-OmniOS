<style>
body{width:390px;height:844px;overflow:hidden;position:relative}
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font:700 15px/1 var(--font)}
.sb i{display:inline-flex;gap:5px;align-items:center}.sb i b{display:inline-block;width:18px;height:10px;border:1.5px solid var(--ink);border-radius:3px;position:relative}.sb i b::after{content:"";position:absolute;inset:1.5px 4px 1.5px 1.5px;background:var(--ink);border-radius:1px}
.top{height:60px;display:flex;align-items:center;gap:12px;padding:0 16px}

.ib{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--ink)}

.btn{min-height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 20px/24px var(--font);padding:0 20px}
.btn.p{background:var(--ac);color:var(--on-ac)}.btn.o{background:var(--s);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.s{min-height:56px;font-size:19px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font:600 18px/1 var(--font);background:var(--s2);color:var(--ink2);white-space:nowrap}

.seg{display:flex;gap:8px;padding:0 16px;overflow:hidden}.seg span{height:44px;padding:0 16px;border-radius:12px;display:flex;align-items:center;font:600 18px/1 var(--font);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line);background:var(--s);white-space:nowrap}.seg span.on{background:var(--ac);color:var(--on-ac);box-shadow:none}

.foot{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 30px;background:var(--bg);box-shadow:0 -1px 0 var(--line)}
.wave{display:flex;align-items:center;gap:5px;height:56px}.wave i{width:6px;border-radius:3px;background:currentColor}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.k button{height:72px;border-radius:18px;background:var(--s);box-shadow:inset 0 0 0 1px var(--line);font:700 28px/1 var(--font);display:grid;place-items:center}
