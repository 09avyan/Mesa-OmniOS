<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dukaan Admin v2</title><link rel="stylesheet" href="base.css">
<style>
body{width:1440px;height:900px;overflow:hidden;font-size:15px;line-height:22px;display:grid;grid-template-columns:240px 1fr}
aside{background:var(--s);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:2px}
aside .brand{display:flex;align-items:center;gap:10px;font:800 18px/1 var(--font);padding:4px 8px 22px}
aside a{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;font:600 15px/1 var(--font);color:var(--ink2)}
aside a.on{background:var(--s2);color:var(--ink)}aside a em{margin-left:auto;font-style:normal;background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 8px;font-size:13px}
aside svg.i{width:20px;height:20px}
main{padding:24px 32px;overflow:hidden;display:flex;flex-direction:column;gap:20px}
.hd{display:flex;align-items:center;gap:12px}.hd h1{font:800 26px/32px var(--font);letter-spacing:-.02em;flex:1}
.in{height:40px;border-radius:10px;background:var(--s);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--ink3);min-width:260px}
.bt{height:40px;border-radius:10px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font:700 15px/1 var(--font);background:var(--s);box-shadow:inset 0 0 0 1px var(--line2)}.bt.p{background:var(--ink);color:var(--bg);box-shadow:none}
.bt svg.i,.in svg.i{width:18px;height:18px}
.card{background:var(--s);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.kpi{padding:18px 20px}.kpi .l{color:var(--ink2);font-weight:600}.kpi .v{font:800 30px/38px var(--font);letter-spacing:-.02em;margin-top:6px}.kpi .s{color:var(--ink3);margin-top:2px}.kpi .s b{color:var(--ok)}
.ct{padding:18px 20px}.ct h2{font:700 17px/24px var(--font);display:flex;align-items:center;justify-content:space-between}
table{width:100%;border-collapse:collapse}th{text-align:left;font:600 13px/1 var(--font);color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;padding:12px 16px;border-bottom:1px solid var(--line)}td{padding:0 16px;height:54px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border:0}
td.n,th.n{text-align:right}.st{display:inline-flex;align-items:center;gap:6px;font-weight:600}.st i{width:8px;height:8px;border-radius:50%;background:var(--ok)}.st.off i{background:var(--line2)}.st.off{color:var(--ink3)}.st.new i{background:var(--vt)}
.av{width:32px;height:32px;border-radius:8px;background:var(--s2);display:inline-grid;place-items:center;font:700 13px/1 var(--font);vertical-align:middle;margin-right:10px}
.lst div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.lst div:last-child{border:0}
</style></head><body>
<script src="icons.js"></script>
<aside id="nav"></aside><main id="app"></main>
<script>
const s=Q.get('s')||'overview';
document.getElementById('nav').innerHTML=`<div class="brand">${LOGO(30)}Dukaan Admin</div>`+[['grid','Overview','overview'],['store','Shops','shops'],['bag','Requests','requests',5],['receipt','Bills'],['chart','Usage & AI'],['sliders','Settings']].map(([i,t,k,b])=>`<a class="${k==s||(s=='shop'&&k=='shops')?'on':''}">${I(i)}${t}${b?`<em>${b}</em>`:''}</a>`).join('')+`<div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--line)"><span class="av" style="margin:0">AD</span><span><b style="display:block">Admin</b><span style="color:var(--ink3)">OmniOS team</span></span></div>`;
const shops=[['SG','Sharma General Store','Lajpat Nagar, Delhi','Active','2 min','₹14,218','38'],['GK','Gupta Kirana','Indiranagar, Bengaluru','Active','6 min','₹11,940','31'],['BS','Bansal Stores','Sector 15, Noida','Active','14 min','₹9,612','27'],['MP','Mahalaxmi Provision','Kothrud, Pune','Active','22 min','₹8,305','24'],['RK','Rajesh Kirana','Salt Lake, Kolkata','Idle','3 hr','₹2,140','6'],['AN','Annapurna Mart','Gomti Nagar, Lucknow','Active','41 min','₹6,870','19'],['NS','New Shree Traders','Navrangpura, Ahmedabad','Off','4 din','₹0','0'],['KB','Krishna Bhandar','Malviya Nagar, Jaipur','Active','9 min','₹7,455','21'],['DS','Devi Super Store','T. Nagar, Chennai','Pilot','—','₹0','0']];
const st=x=>`<span class="st ${x=='Active'?'':x=='Pilot'?'new':'off'}"><i></i>${x}</span>`;
const pts=[38,42,40,51,48,55,61,58,64,70,66,74,79,72,81,88,84,91,96,90,102,108,104,112,118,114,121,128,124,133];
function chart(w,h){const mx=140,mn=30,X=i=>i*(w/(pts.length-1)),Y=v=>h-((v-mn)/(mx-mn))*h;const d=pts.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
return `<svg width="100%" viewBox="0 -10 ${w} ${h+34}" style="display:block">${[0,1,2,3].map(k=>`<line x1="0" x2="${w}" y1="${k*h/3}" y2="${k*h/3}" stroke="var(--line)"/><text x="0" y="${k*h/3-6}" font-size="12" fill="var(--ink3)">₹${[14,10.3,6.7,3][k]}L</text>`).join('')}
<path d="${d} L${w} ${h} L0 ${h}Z" fill="var(--ink)" opacity=".05"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="${X(29)}" cy="${Y(133)}" r="5" fill="var(--ink)" stroke="var(--s)" stroke-width="2"/>
${['27 Oct','3 Nov','10 Nov','17 Nov','25 Nov'].map((t,i)=>`<text x="${i*w/4}" y="${h+24}" font-size="12" fill="var(--ink3)" text-anchor="${i==0?'start':i==4?'end':'middle'}">${t}</text>`).join('')}</svg>`}
const hd=(t,r='')=>`<div class="hd"><h1>${t}</h1>${r}</div>`;
const V={
overview:()=>`${hd('Overview',`<div class="in">${I('search')}Shop, phone, bill…</div><button class="bt">${I('clock')}Last 30 days${I('chevD')}</button>`)}
<div class="kpis">${[['Shops','148','<b>+12</b> this month'],['Active today','117','79% of shops'],['Bills today','3,942','<b>+8%</b> vs last Tue'],['Sales today','₹9.84L','7d ₹62.1L · 30d ₹2.46Cr']].map(([l,v,x])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${x}</div></div>`).join('')}</div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;min-height:0">
<div class="card ct"><h2>Sales, all shops <span style="display:flex;gap:18px;font-weight:600;color:var(--ink2)"><span>Udhaar outstanding <b class="ud">₹18.7L</b></span><span>AI calls today <b style="color:var(--ink)">11,206</b></span></span></h2><div style="margin-top:14px">${chart(780,215)}</div></div>
<div class="card ct"><h2>Recent activity</h2><div class="lst" style="margin-top:6px">${[['Sharma General Store','Bill ₹344 · UPI','now'],['Gupta Kirana','Bill ₹1,120 · Cash','1m'],['Devi Super Store','Shop created','8m'],['Bansal Stores','Udhaar ₹486','11m'],['Rajesh Kirana','PIN reset','34m'],['Krishna Bhandar','Online order ₹612','52m']].map(([a,b,c])=>`<div><span><b style="display:block">${a}</b><span style="color:var(--ink3)">${b}</span></span><span style="color:var(--ink3)">${c}</span></div>`).join('')}</div></div></div>
<div class="card"><table><tr><th>Top shops today</th><th>City</th><th>Status</th><th class="n">Bills</th><th class="n">Sales</th></tr>${shops.slice(0,4).map(r=>`<tr><td><span class="av">${r[0]}</span><b>${r[1]}</b></td><td style="color:var(--ink2)">${r[2]}</td><td>${st(r[3])}</td><td class="n">${r[6]}</td><td class="n"><b>${r[5]}</b></td></tr>`).join('')}</table></div>`,
shops:()=>`${hd('Shops <span style="color:var(--ink3);font-weight:600">148</span>',`<div class="in">${I('search')}Search shops</div><button class="bt">${I('filter')}Status: All</button><button class="bt p">${I('plus')}New shop</button>`)}
<div class="card"><table><tr><th>Shop ↓</th><th>Area</th><th>Status</th><th>Last active</th><th class="n">Bills today</th><th class="n">Sales today</th><th class="n">Udhaar</th><th></th></tr>${shops.map((r,i)=>`<tr><td><span class="av">${r[0]}</span><b>${r[1]}</b></td><td style="color:var(--ink2)">${r[2]}</td><td>${st(r[3])}</td><td style="color:var(--ink2)">${r[4]}</td><td class="n">${r[6]}</td><td class="n"><b>${r[5]}</b></td><td class="n ud">₹${[38560,21400,17020,12880,9400,8210,3100,11760,0][i].toLocaleString('en-IN')}</td><td class="n"><button class="bt" style="height:34px">Open</button></td></tr>`).join('')}</table></div>`,
shop:()=>`${hd('<span style="color:var(--ink3);font-weight:600">Shops /</span> Sharma General Store',`<button class="bt">${I('lock')}Reset PIN</button><button class="bt">${I('phone')}Call owner</button><button class="bt p">${I('edit')}Edit</button>`)}
<div style="display:grid;grid-template-columns:340px 1fr;gap:16px">
<div class="card ct"><div style="display:flex;gap:12px;align-items:center">${LOGO(48)}<div><b style="font-size:18px">Sharma General Store</b><div>${st('Active')} <span style="color:var(--ink3)">· since 2 Sep 2026</span></div></div></div>
<div class="lst" style="margin-top:14px">${[['Code','SGS-2041'],['Owner','Ramesh Sharma'],['Owner phone','+91 98110 42xxx'],['Staff phone','+91 98734 17xxx'],['UPI','sharmagen@okaxis'],['Area','Lajpat Nagar, Delhi'],['Language','Hinglish']].map(([a,b])=>`<div><span style="color:var(--ink2)">${a}</span><b>${b}</b></div>`).join('')}</div></div>
<div style="display:grid;gap:16px;align-content:start"><div class="kpis">${[['Sales today','₹14,218'],['30-day sales','₹3.92L'],['Udhaar out','₹38,560'],['AI calls 30d','2,914']].map(([l,v],i)=>`<div class="card kpi"><div class="l">${l}</div><div class="v ${i==2?'ud':''}">${v}</div></div>`).join('')}</div>
<div class="card"><table><tr><th>Recent bills</th><th>Customer</th><th>Payment</th><th>Time</th><th class="n">Amount</th></tr>${[['#1042','Sharma ji','UPI','10:42','₹344'],['#1041','Ravi Verma','Cash','10:31','₹1,120'],['#1040','Geeta Kaur','Udhaar','10:15','₹486'],['#1039','Walk-in','Cash','10:02','₹62'],['#1038','Mohd. Aslam','UPI','9:48','₹2,035'],['#1037','Pooja Singh','Cash','9:30','₹218']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="${r[2]=='Udhaar'?'ud':''}" style="font-weight:600">${r[2]}</td><td style="color:var(--ink2)">${r[3]}</td><td class="n"><b>${r[4]}</b></td></tr>`).join('')}</table></div></div></div>`,
requests:()=>`${hd('Requests',`<button class="bt">${I('download')}Export</button>`)}
<div class="kpis">${[['Open requests','5'],['Bags requested','1,800'],['Shops waiting','4'],['Top demand','Parle-G 250g']].map(([l,v])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px"><div class="card"><table><tr><th>Shop</th><th>Request</th><th>Qty</th><th>Raised</th><th>Status</th><th></th></tr>${[['SG','Sharma General Store','Bags (medium)','500','Today 9:10','New'],['GK','Gupta Kirana','Bags (small)','800','Yesterday','New'],['KB','Krishna Bhandar','Thermal printer','1','24 Nov','In progress'],['AN','Annapurna Mart','Bags (large)','300','23 Nov','New'],['BS','Bansal Stores','QR standee','2','22 Nov','Done']].map(r=>`<tr><td><span class="av">${r[0]}</span><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td><td style="color:var(--ink2)">${r[4]}</td><td>${st(r[5]=='New'?'Pilot':r[5]=='Done'?'Active':'Idle').replace(/Pilot|Active|Idle/,r[5])}</td><td class="n"><button class="bt" style="height:34px">${r[5]=='Done'?'View':'Mark done'}</button></td></tr>`).join('')}</table></div>
<div class="card ct"><h2>Demand · items asked, not in stock</h2><div style="margin-top:10px">${[['Parle-G 250g',92],['Amul Taaza 500ml',74],['Fortune Soya Oil 1L',58],['Surf Excel 1kg',41],['Tata Salt 1kg',33]].map(([n,v])=>`<div style="padding:9px 0"><div style="display:flex;justify-content:space-between"><b style="font-weight:600">${n}</b><span style="color:var(--ink2)">${v} shops</span></div><div style="height:8px;border-radius:4px;background:var(--s2);margin-top:6px"><div style="height:100%;width:${v}%;border-radius:4px;background:var(--ink)"></div></div></div>`).join('')}</div></div></div>`};
document.getElementById('app').innerHTML=V[s]();
</script></body></html>
