<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;800&display=swap"><style>
body{margin:0;padding:40px;background:#F6F6F3;font:600 15px/20px 'Hanken Grotesk';color:#141517;width:1100px}h1{font:800 28px/1 'Hanken Grotesk';margin:0 0 24px}
.row{display:flex;gap:24px;align-items:flex-end;padding:20px 24px;border-radius:18px;margin-bottom:16px}.row.l{background:#fff;box-shadow:inset 0 0 0 1px #E4E4DE}.row.d{background:#0E0F0F;color:#ABB0AD}
figure{margin:0;display:grid;gap:8px;justify-items:center}figcaption{font-size:13px;opacity:.8}.px img{image-rendering:pixelated}
.tab{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px 10px 0 0;background:#fff;box-shadow:inset 0 0 0 1px #E4E4DE;font:500 13px/1 system-ui}
</style></head><body><h1>Logo A · size check</h1>
<div class="row l">
<figure><img src="favicon.svg" width="16"><figcaption>16 favicon</figcaption></figure>
<figure><img src="favicon.svg" width="32"><figcaption>32 favicon</figcaption></figure>
<figure><img src="logo-a.svg" width="48"><figcaption>48 full</figcaption></figure>
<figure class="px"><img src="favicon-16.png" style="width:64px;height:64px"><figcaption>16px real pixels ×4</figcaption></figure>
<figure class="px"><img src="favicon-32.png" style="width:64px;height:64px"><figcaption>32px real pixels ×2</figcaption></figure>
<figure><img src="logo-a.svg" width="96"><figcaption>96 logo-a.svg</figcaption></figure>
<figure><img src="icon-192.png" width="96"><figcaption>icon-192</figcaption></figure>
<figure><img src="maskable-512.png" width="96" style="border-radius:50%"><figcaption>maskable (circle mask)</figcaption></figure>
<figure><img src="apple-touch-180.png" width="96" style="border-radius:22px"><figcaption>apple-touch-180</figcaption></figure>
</div>
<div class="row d">
<figure><img src="favicon.svg" width="16"><figcaption>16</figcaption></figure>
<figure><img src="favicon.svg" width="32"><figcaption>32</figcaption></figure>
<figure><img src="logo-a.svg" width="48"><figcaption>48 standard (tile edge lost)</figcaption></figure>
<figure><img src="logo-a-dark.svg" width="48"><figcaption>48 dark variant</figcaption></figure>
<figure><img src="logo-a-dark.svg" width="96"><figcaption>96 logo-a-dark.svg</figcaption></figure>
</div>
<div class="row l" style="gap:8px;align-items:center;background:#DEDED8"><span class="tab"><img src="favicon.svg" width="16">Dukaan · Sharma General Store</span><span class="tab" style="background:#EEEEE9"><img src="favicon.svg" width="16">Dukaan Admin</span></div>
</body></html>
