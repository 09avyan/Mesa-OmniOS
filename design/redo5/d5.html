<!doctype html>
<html lang="hi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OmniOS Dukaan</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Design 5 · chat. The shop runs like a conversation: you speak, the bill comes back as a card in the thread. */
:root{--acc:#0B7A5A;--acc-soft:#E3F3EC;--bg:#EFEAE2;--me:#D7F4D0;--card:#FFFFFF;--tx:#101312;--tx2:#3A403D;--tx3:#5E6662;--sep:#E5E2DC;--ud:#9A5B00;--ud-soft:#FBF0DC;--top:#FFFFFF}
[data-theme="dark"]{--acc:#25C28C;--acc-soft:#123A2E;--bg:#0B1210;--me:#13362B;--card:#1C2421;--tx:#F1F4F2;--tx2:#D5DBD8;--tx3:#A3ADA8;--sep:#2A3330;--ud:#FFB547;--ud-soft:#3A2A10;--top:#151C1A}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--tx);font:500 18px/25px -apple-system,Roboto,"Noto Sans Devanagari",system-ui,sans-serif;max-width:440px;margin:0 auto;min-height:100dvh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p:active{transform:scale(.97)}
.top{position:sticky;top:0;z-index:20;background:var(--top);display:flex;align-items:center;gap:12px;padding:10px 8px 10px 16px;border-bottom:1px solid var(--sep)}
.top .logo{display:grid;color:#fff;font-size:20px;width:46px;height:46px;border-radius:23px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.top .t{flex:1}.top b{display:block;font-size:19px;font-weight:800}.top span{display:block;font-size:17px;color:var(--tx3)}
.ib{width:56px;height:56px;border-radius:28px;display:grid;place-items:center}
.thread{padding:14px 12px 150px;display:flex;flex-direction:column;gap:10px}
.day{align-self:center;background:var(--card);color:var(--tx3);font-size:17px;font-weight:600;padding:4px 14px;border-radius:12px}
.bub{max-width:88%;background:var(--card);border-radius:4px 18px 18px 18px;padding:12px 14px;box-shadow:0 1px 0 rgba(0,0,0,.06);animation:in .3s ease both}
.bub.me{align-self:flex-end;background:var(--me);border-radius:18px 4px 18px 18px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub small{display:block;font-size:17px;color:var(--tx3);font-weight:600}
.bub .big{font-size:44px;line-height:52px;font-weight:800;letter-spacing:-.5px}
.bub .row{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-top:1px solid var(--sep);font-size:18px}
.bub .row:first-of-type{border-top:0}
.bub .row b{font-weight:800}.bub .ud{color:var(--ud)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:56px;padding:0 16px;border-radius:28px;background:var(--acc-soft);color:var(--acc);font-weight:800;font-size:17px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--acc);color:#fff}
.chip.u.on{background:var(--ud);color:#fff}
.chip[disabled]{opacity:.4}
.billc{width:88%}
.billc h3{font-size:19px;font-weight:800}.billc .who{font-size:17px;color:var(--ud);font-weight:700;margin-bottom:4px}
.it{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--sep)}
.it b{font-size:18px;font-weight:700}.it span{display:block;font-size:17px;color:var(--tx3)}.it .r{font-weight:800}
.it.q{background:var(--ud-soft);margin:0 -14px;padding:8px 14px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;border-top:2px solid var(--tx)}
.tot b{font-size:30px;font-weight:800}
.ask p{font-size:17px;font-weight:700;margin-top:6px}
.note{font-size:17px;color:var(--ud);font-weight:700;margin-top:8px}
.cf{margin-top:10px;width:100%;min-height:60px;border-radius:30px;background:var(--acc);color:#fff;font-weight:800;font-size:18px}
.cf[disabled]{background:var(--sep);color:var(--tx3)}
.typing{display:flex;gap:5px;padding:4px 2px}.typing i{width:9px;height:9px;border-radius:5px;background:var(--tx3);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25;transform:translateY(-3px)}}
.okb{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--acc)}
.okb i{width:40px;height:40px;border-radius:20px;background:var(--acc);color:#fff;display:grid;place-items:center}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;background:var(--bg)}
.field{flex:1;min-height:60px;border-radius:30px;background:var(--card);display:flex;align-items:center;padding:0 18px;color:var(--tx3);font-size:18px;font-weight:600}
.voice{width:68px;height:68px;border-radius:34px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.voice.rec{background:#111;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(11,122,90,.25)}}
.tabs{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="m" viewBox="0 0 24 24"><rect class="ic" x="9" y="2.5" width="6" height="12" rx="3"/><path class="ic" d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
<symbol id="moon" viewBox="0 0 24 24"><path class="ic" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
<symbol id="menu" viewBox="0 0 24 24"><path class="ic" d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="ck" viewBox="0 0 24 24"><path class="ic" d="M5 12.5l4.5 4.5L19 7.5" style="stroke-width:2.8"/></symbol></svg>
<div class="top"><span class="logo">श</span><div class="t"><b data-t="shop"></b><span data-t="sub"></span></div><button class="ib p" onclick="tt()"><svg width="24" height="24"><use href="#moon"/></svg></button><button class="ib p"><svg width="24" height="24"><use href="#menu"/></svg></button></div>
<div class="thread" id="th">
  <span class="day" data-t="day"></span>
  <div class="bub"><small data-t="today"></small><div class="big">₹14,218</div><div class="row"><span data-t="cash"></span><b>₹9,642</b></div><div class="row"><span>UPI</span><b>₹3,456</b></div><div class="row ud"><span data-t="udg"></span><b>₹1,120</b></div></div>
  <div class="bub"><small data-t="todo"></small><div class="row"><span data-t="t1"></span><b>2</b></div><div class="row ud"><span data-t="t2"></span><b>₹32,484</b></div><div class="row"><span data-t="t3"></span><b>✓</b></div><div class="chips"><button class="chip p" data-t="c1"></button><button class="chip p" data-t="c2"></button></div></div>
</div>
<div class="composer"><div class="field" id="fld" data-t="ph"></div><button class="voice p" id="vb" onclick="speak()" aria-label="Bolo"><svg width="30" height="30"><use href="#m"/></svg></button></div>
<script>
const T={hinglish:{shop:'Sharma General Store',sub:'Dukaan ka hisaab',day:'Aaj · Mangal, 24 Nov',today:'Aaj ki bikri · 68 bill',cash:'Cash',udg:'Udhaar diya',todo:'Aaj ka kaam',t1:'Naye online order',t2:'Paisa lena hai · 15 log',t3:'3 saaman gino',c1:'Order dekho',c2:'Yaad dilao',ph:"Bolo, bill banao…",said:'Sharma ji, do kilo cheeni, ek Maggi, aadha kilo toor dal',bill:'Bill · Sharma ji',old:'Pehle ka udhaar ₹2,416',names:['Cheeni','Maggi chhota?','Toor dal'],units:['2 kg × ₹46','1 × ₹14','aadha kg × ₹150'],ask:'Yahi wali Maggi? ₹14 ka chhota packet',yes:'Haan, yahi',no:'Doosri',total:'Kul',how:'Paisa kaise mila?',udhaar:'Udhaar',nU:'Khata ₹2,416 → ₹2,597',c0:'Pehle Maggi pakka karo',cP:'Paisa kaise mila, chuniye',cX:'Pakka karo · ',saved:'Bill save · Sharma ji ka khata ab ₹2,597',wa:'WhatsApp bhejo',undo:'Wapas lo',listening:'Sun raha hoon…'},
hi:{shop:'शर्मा जनरल स्टोर',sub:'दुकान का हिसाब',day:'आज · मंगल, 24 नवंबर',today:'आज की बिक्री · 68 बिल',cash:'नकद',udg:'उधार दिया',todo:'आज का काम',t1:'नए ऑनलाइन ऑर्डर',t2:'पैसा लेना है · 15 लोग',t3:'3 सामान गिनो',c1:'ऑर्डर देखो',c2:'याद दिलाओ',ph:"बोलो, बिल बनाओ…",said:'शर्मा जी, दो किलो चीनी, एक मैगी, आधा किलो तूर दाल',bill:'बिल · शर्मा जी',old:'पहले का उधार ₹2,416',names:['चीनी','मैगी छोटा?','तूर दाल'],units:['2 किलो × ₹46','1 × ₹14','आधा किलो × ₹150'],ask:'यही वाली मैगी? ₹14 का छोटा पैकेट',yes:'हाँ, यही',no:'दूसरी',total:'कुल',how:'पैसा कैसे मिला?',udhaar:'उधार',nU:'खाता ₹2,416 → ₹2,597',c0:'पहले मैगी पक्का करो',cP:'पैसा कैसे मिला, चुनिए',cX:'पक्का करो · ',saved:'बिल सेव · शर्मा जी का खाता अब ₹2,597',wa:'WhatsApp भेजो',undo:'वापस लो',listening:'सुन रहा हूँ…'}}
const Q=new URLSearchParams(location.search),L=Q.get('lang')||'hinglish',D=T[L]||T.hinglish,$=s=>document.querySelector(s),w=ms=>new Promise(r=>setTimeout(r,ms))
document.documentElement.dataset.theme=Q.get('theme')||'light';function tt(){const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'}
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=D[e.dataset.t])
let open=true,pay=null
const add=h=>{$('#th').insertAdjacentHTML('beforeend',h);scrollTo(0,document.body.scrollHeight)}
async function speak(){$('#vb').classList.add('rec');$('#fld').textContent=D.listening;add('<div class="bub me" id="me"></div>');const ws=D.said.split(' ');let s='';for(const x of ws){await w(200);s+=(s?' ':'')+x;$('#me').textContent=s;scrollTo(0,document.body.scrollHeight)}
 $('#vb').classList.remove('rec');$('#fld').textContent=D.ph;add('<div class="bub" id="ty"><div class="typing"><i></i><i></i><i></i></div></div>');await w(600);$('#ty').remove()
 add(`<div class="bub billc"><h3>${D.bill}</h3><div class="who">${D.old}</div>${[0,1,2].map(i=>`<div class="it${i==1?' q':''}" id="r${i}"><div><b>${D.names[i]}</b><span>${D.units[i]}</span></div><span class="r">₹${[92,14,75][i]}</span></div>`).join('')}
 <div class="ask" id="ask"><p>${D.ask}</p><div class="chips"><button class="chip p">${D.no}</button><button class="chip on p y" onclick="ok()">✓ ${D.yes}</button></div></div>
 <div class="tot"><span>${D.total}</span><b>₹181</b></div><p style="font-size:17px;font-weight:800;margin-top:10px">${D.how}</p>
 <div class="chips"><button class="chip pay p" data-p="c" disabled>${T.hinglish.cash===D.cash?'Cash':D.cash}</button><button class="chip pay p" data-p="p" disabled>UPI</button><button class="chip pay u p" data-p="u" disabled>${D.udhaar}</button></div><p class="note" id="nt"></p><button class="cf p" id="cf" disabled onclick="done()">${D.c0}</button></div>`)
 document.querySelectorAll('.pay').forEach(b=>b.onclick=()=>{if(open)return;pay=b.dataset.p;document.querySelectorAll('.pay').forEach(x=>x.classList.toggle('on',x===b));st()})}
window.speakGo=speak
function ok(){open=false;$('#ask').remove();$('#r1').classList.remove('q');$('#r1 b').textContent=D.names[1].replace('?','');document.querySelectorAll('.pay').forEach(x=>x.disabled=false);st()}
function st(){const c=$('#cf');c.disabled=open||!pay;c.textContent=open?D.c0:!pay?D.cP:D.cX+'₹181';$('#nt').textContent=pay==='u'?D.nU:''}
function done(){$('#cf').remove();add(`<div class="bub"><div class="okb"><i><svg width="22" height="22"><use href="#ck"/></svg></i>${D.saved}</div><div class="chips"><button class="chip p">${D.wa}</button><button class="chip p">${D.undo}</button></div></div>`)}
</script>
</body>
</html>
