<!doctype html>
<html lang="hi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OmniOS Dukaan</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800;900&family=Mukta:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Design 1 · clean modern. Apple calm (grouped lists, large titles, system type), PhonePe familiarity (money first, one big action),
   Spotify boldness (heavy type, full-screen "now listening" with the words lit up like lyrics). Light + dark. */
:root{
  --acc:#0E6B61; --acc-ink:#FFFFFF; --acc-soft:rgba(14,107,97,.10); --pass:#0E5E57;
  --bg:#FFFFFF; --surf:#F4F4F6; --surf2:#F7F7FA; --tx:#0B0B0F; --tx2:#3C3C43; --tx3:#5E5E66; --sep:rgba(60,60,67,.16);
  --ud:#9A5B00; --ud-soft:rgba(154,91,0,.10); --ok:#1F8A4C; --ok-soft:rgba(31,138,76,.12);
  --listen-bg:#0E5E57; --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#000000; --surf:#1C1C1E; --surf2:#2C2C2E; --tx:#FFFFFF; --tx2:#EBEBF5; --tx3:#AEAEB2; --sep:rgba(84,84,88,.6);
  --ud:#FFB547; --ud-soft:rgba(255,181,71,.14); --ok:#4CD47F; --ok-soft:rgba(76,212,127,.14); --acc:#3CC2B0; --acc-soft:rgba(60,194,176,.16); --pass:#0F4A45;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--tx);font:500 18px/25px -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Noto Sans Devanagari",system-ui,sans-serif;max-width:440px;margin:0 auto;min-height:100dvh;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{flex:none}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:12px}
.p{transition:transform .12s var(--ease),opacity .12s}.p:active{transform:scale(.96);opacity:.85}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.view{display:none;padding-bottom:120px}.view.on{display:block}

/* header */
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 0 20px;min-height:60px}
.nav .shop{font-size:17px;font-weight:600;color:var(--tx3)}
.nav .r{display:flex;gap:2px}
.ib{min-width:56px;min-height:56px;border-radius:28px;display:grid;place-items:center;color:var(--tx)}
.ib:active{background:var(--surf2)}
.large{font-size:34px;line-height:41px;font-weight:800;letter-spacing:-.6px;padding:2px 20px 0}

/* hero money */
.hero{padding:18px 20px 6px}
.hero small{display:block;font-size:17px;font-weight:600;color:var(--tx3)}
.hero b{display:block;font-size:60px;line-height:68px;font-weight:800;margin-top:2px}
.hero span{font-size:17px;color:var(--tx3);font-weight:500}
.hero span em{font-style:normal;color:var(--ok);font-weight:700}
.chips{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto}
.chip{flex:1;min-width:0;background:var(--surf);border-radius:16px;padding:12px 14px}
.chip small{display:block;font-size:17px;color:var(--tx3);font-weight:600}
.chip b{display:block;font-size:23px;line-height:30px;font-weight:800}
.chip.u b{color:var(--ud)}

/* due strip + order line + timeline */
.due2{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:12px 12px 12px 16px;border-radius:18px;background:var(--ud-soft)}.due2 div{flex:1}.due2 small{display:block;font-size:17px;font-weight:700;color:var(--ud)}.due2 b{font-size:28px;font-weight:800;color:var(--ud)}.due2 span{display:block;font-size:17px;color:var(--tx3)}
.ord2{display:flex;align-items:center;gap:10px;margin:10px 16px 0;padding:8px 8px 8px 16px;border-radius:18px;background:var(--surf)}.ord2 b{flex:1;font-size:18px}.dot2{width:10px;height:10px;border-radius:5px;background:var(--acc)}
.tl2{padding:18px 0 0}.tl2 h3{font-size:22px;font-weight:800;padding:0 20px 4px}
.tx{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--sep)}.tm{width:46px;font-size:17px;color:var(--tx3);font-weight:600}
.tx .t{flex:1;min-width:0}.tx .t b{display:block;font-size:18px}.tx .t span{display:block;font-size:17px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .r{text-align:right}.tx .r b{display:block;font-size:19px;font-weight:800}.tx .ud{color:var(--ud)}.okc2{color:var(--ok)}
.b{display:inline-block;font-size:17px;font-weight:700;padding:0 8px;border-radius:8px}.b.c{color:#1F8A4C;background:rgba(31,138,76,.1)}.b.u2{color:#3A6FF2;background:rgba(58,111,242,.1)}.b.d{color:var(--ud);background:var(--ud-soft)}
/* wallet pass + quick actions */
.passc{margin:14px 16px 0;border-radius:22px;background:var(--pass);color:#fff;padding:18px 20px 16px;box-shadow:0 18px 30px -22px rgba(14,94,87,.9)}
.pt{display:flex;justify-content:space-between;font-size:17px;font-weight:600;color:rgba(255,255,255,.78)}
.passc>b{display:block;font-size:58px;line-height:66px;font-weight:800;margin-top:6px}
.pv{font-size:17px;color:#9FF0DD;font-weight:700}
.pr{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.pr small{display:block;font-size:17px;color:rgba(255,255,255,.72);font-weight:600}.pr b{font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:18px 10px 0}
.ga{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:17px;line-height:20px;font-weight:700;text-align:center;min-height:96px}
.gi{width:60px;height:60px;border-radius:18px;background:var(--surf);color:var(--acc);display:grid;place-items:center}
/* grouped list (Apple) */
.gh{display:flex;justify-content:space-between;align-items:baseline;padding:30px 20px 8px}
.gh h2{font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.3px}
.gh span{font-size:17px;color:var(--acc);font-weight:700}
.group{margin:0 16px;background:var(--surf);border-radius:16px;overflow:hidden}
.cell{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 16px;min-height:72px;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:66px;right:0;height:1px;background:var(--sep)}
.cell.noic+.cell::before,.cell.noic::before{left:16px}
.av{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;background:var(--surf2);color:var(--tx2)}
.av.o{background:var(--acc-soft);color:var(--acc)}
.cell .t{flex:1;min-width:0}
.cell .t b{display:block;font-size:18px;line-height:24px;font-weight:700}
.cell .t span{display:block;font-size:17px;line-height:22px;color:var(--tx3)}
.cell .amt{font-size:20px;font-weight:800;color:var(--ud)}
.pill{min-height:56px;padding:0 16px;border-radius:28px;background:var(--surf2);font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:6px;flex:none}
.pill.acc{background:var(--acc);color:var(--acc-ink)}
.chev{color:var(--tx3)}

/* tab bar + center action (PhonePe-style placement) */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;height:84px;padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--sep);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;z-index:40}
.dock{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);width:calc(100% - 16px);max-width:424px;height:72px;border-radius:16px;background:var(--pass);color:#fff;display:flex;align-items:center;gap:12px;padding:0 10px 0 14px;z-index:41;box-shadow:0 12px 24px -14px rgba(0,0,0,.6);text-align:left}
.dock .t{flex:1;min-width:0}.dock b{display:block;font-size:19px;font-weight:800}.dock span{display:block;font-size:17px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .m{width:56px;height:56px;border-radius:28px;background:#fff;color:var(--pass);display:grid;place-items:center;flex:none}
#home{padding-bottom:190px}
.tab{height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:17px;line-height:20px;font-weight:600;color:var(--tx3)}
.tab.on{color:var(--acc)}
.micx{width:78px;height:78px;margin:-30px auto 0;border-radius:39px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(255,90,31,.6),0 0 0 6px var(--bg)}
.micl{text-align:center;font-size:17px;font-weight:800;color:var(--acc);margin-top:2px}

/* listening: Spotify-lyrics style */
#listen{background:var(--listen-bg);color:#fff;min-height:100dvh}
.lt{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 0 8px}
.lt .ib{color:#fff}
.lt span{font-size:17px;font-weight:700;color:rgba(255,255,255,.7);padding-right:14px}
.lyr{padding:28px 24px 0;font-size:34px;line-height:46px;font-weight:800;letter-spacing:-.6px;min-height:280px}
.lyr .w{color:rgba(255,255,255,.28);transition:color .2s}
.lyr .w.on{color:#fff}
.bars{display:flex;gap:5px;align-items:flex-end;height:36px;padding:0 24px}
.bars i{width:6px;border-radius:3px;background:#9FF0DD;animation:b .8s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.1s}.bars i:nth-child(3){animation-delay:.2s}.bars i:nth-child(4){animation-delay:.3s}.bars i:nth-child(5){animation-delay:.15s}
@keyframes b{0%,100%{height:8px}50%{height:34px}}
.livebill{margin:22px 16px 0;background:rgba(0,0,0,.22);border-radius:16px;overflow:hidden}
.lrow{display:flex;justify-content:space-between;padding:12px 16px;font-size:18px;font-weight:700;animation:in .35s var(--ease) both}
.lrow+.lrow{border-top:1px solid rgba(255,255,255,.1)}
.lrow span{color:rgba(255,255,255,.6);font-weight:500}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lfoot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;padding:16px 20px calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,var(--listen-bg) 30%);z-index:40}
.lfoot small{display:block;font-size:17px;color:rgba(255,255,255,.6);font-weight:600}
.lfoot b{font-size:36px;line-height:42px;font-weight:800}
.done-btn{min-height:64px;padding:0 26px;border-radius:32px;background:#fff;color:#000;font-weight:800;font-size:19px;display:inline-flex;align-items:center;gap:8px}

/* review */
.who{display:flex;align-items:center;gap:14px;margin:6px 16px 0;padding:14px 16px;background:var(--surf);border-radius:16px}
.who .av{display:grid;place-items:center;width:48px;height:48px;border-radius:24px;background:var(--acc-soft);color:var(--acc);font-size:20px}
.who b{display:block;font-size:19px;font-weight:800}.who span{display:block;font-size:17px;color:var(--ud);font-weight:600}
.who .t{flex:1}
.item{padding:12px 14px 12px 16px;position:relative}
.item+.item::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.item .a{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item .a b{font-size:19px;font-weight:700}.item .a .num{font-size:19px;font-weight:800}
.item .s{font-size:17px;color:var(--tx3);margin-top:2px}
.item.q{background:var(--acc-soft)}
.q .ask{margin-top:10px}
.q .ask p{font-size:17px;font-weight:700}
.q .ask div{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.q .ask button{min-height:56px;border-radius:28px;font-weight:700;font-size:17px;background:var(--surf);display:flex;align-items:center;justify-content:center;gap:6px}
.q .ask button.y{background:var(--acc);color:#fff}
.seg{display:flex;align-items:center;gap:0;margin-top:8px;background:var(--surf2);border-radius:28px;width:max-content}
.seg button{width:56px;height:56px;display:grid;place-items:center}
.seg em{min-width:72px;text-align:center;font-style:normal;font-weight:800;font-size:18px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 0}
.total span{font-size:20px;font-weight:700;color:var(--tx3)}
.total b{font-size:40px;line-height:48px;font-weight:800}
.payrow{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:12px 16px 0;padding:4px;background:var(--surf);border-radius:20px}
.pay{min-height:80px;border-radius:16px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:18px;border:2px solid transparent}
.pay[disabled]{opacity:.4}
.pay.on{background:var(--bg);color:var(--acc);border-color:var(--acc);box-shadow:0 4px 12px -6px rgba(0,0,0,.3)}
.pay.u.on{border-color:var(--ud);background:var(--ud-soft);color:var(--ud)}
.note{margin:10px 20px 0;font-size:17px;color:var(--tx3);font-weight:600}
.note.ud{color:var(--ud)}
.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;gap:10px;z-index:40}
.cta .main{flex:1;min-height:64px;border-radius:32px;background:var(--acc);color:#fff;font-weight:800;font-size:18px;padding:0 16px}
.cta .main[disabled]{background:var(--surf2);color:var(--tx3)}
.cta .sm{width:64px;height:64px;border-radius:32px;background:var(--surf);color:var(--acc);display:grid;place-items:center;flex:none}

/* done */
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px 0}
.okc{width:96px;height:96px;border-radius:48px;background:var(--acc);color:#fff;display:grid;place-items:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.ok h1{font-size:30px;line-height:36px;font-weight:800;margin-top:18px;letter-spacing:-.4px}
.ok .num{font-size:52px;line-height:60px;font-weight:800;margin-top:4px}
.ok p{font-size:18px;color:var(--tx3);margin-top:4px}
.after{margin:22px 16px 0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 16px 0}
.acts .pill{width:100%;justify-content:center;min-height:60px;border-radius:30px}
body.hi .large,body.hi .lyr,body.hi .ok h1{line-height:1.45}

/* ===== b-version fixes (panel 24 Nov) + AI-reduction ===== */
body{font-family:"Hanken Grotesk","Mukta",sans-serif!important}
.num,b.num,.big,.passc>b,.hero b{font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.8px}
.av{display:none!important}.hero em,.pv,.up,[data-t="vs"]{display:none!important}
.tabbar,.cta{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--bg)!important}
.group,.who,.chip,.cell{border-radius:10px!important}
.pill,.q .ask button,.seg,.done-btn{border-radius:14px!important}
.payrow{gap:8px!important;padding:0!important;background:none!important}
.pay{min-height:88px!important;border-radius:14px!important;border:2px solid var(--sep)!important;background:var(--surf)!important;font-size:19px!important}
.pay svg{width:32px;height:32px}
.pay.on{border-width:3px!important}
.cta .main{border-radius:16px!important;min-height:68px!important}.cta .sm{border-radius:16px!important;width:68px!important;height:68px!important}
.receipt{margin:16px 16px 0;padding:6px 16px;border-radius:10px;background:var(--surf)}
.receipt div{display:flex;justify-content:space-between;padding:10px 0;font-size:18px;border-bottom:1px dashed var(--sep)}.receipt div:last-child{border-bottom:0;font-weight:800;font-size:20px}
.nextb{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 16px 0;width:calc(100% - 32px);min-height:68px;border-radius:16px;background:var(--acc);color:var(--acc-ink,#fff);font-weight:800;font-size:19px}
.ok{padding-top:28px!important}

#home{padding-bottom:230px!important}.dock{bottom:96px!important}
.passc{padding:14px 18px 14px!important}.passc>b{font-size:50px!important;line-height:56px!important}
.tx.new{background:var(--acc-soft);margin:0;padding:10px 20px}.tm{font-weight:800!important}
.b{background:none!important;padding:0!important}


/* ===== layout + not-AI pass 2 ===== */
.bi-wrap{padding:24px 16px 120px;background:var(--bg)}
.bi{background:#FFFDF8;color:#1A1A1A;border-radius:6px;padding:22px 20px 18px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 24px -18px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;position:relative}
.bi::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 6px -2px,transparent 6px,#FFFDF8 6.5px) 0 0/12px 8px repeat-x}
.bi-h{text-align:center;border-bottom:1.5px solid #1A1A1A;padding-bottom:10px}.bi-h b{display:block;font-size:22px;font-weight:900}.bi-h span{font-size:17px;color:#555}
.bi-m{display:flex;justify-content:space-between;font-size:17px;color:#444;padding:10px 0;border-bottom:1px dashed #BBB}
.bi-c{padding:10px 0;font-size:18px}.bi-c span{color:#555;margin-right:6px}
.bi-t{width:100%;border-collapse:collapse;font-size:18px}.bi-t th{text-align:left;font-size:17px;color:#555;font-weight:700;border-bottom:1px solid #1A1A1A;padding:6px 0}.bi-t th:last-child,.bi-t td:last-child{text-align:right}.bi-t td{padding:9px 0;border-bottom:1px dashed #CCC}.bi-t td:nth-child(2){color:#555;font-size:17px}
.bi-tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 6px;border-top:2px solid #1A1A1A;margin-top:4px}.bi-tot span{font-size:20px;font-weight:800}.bi-tot b{font-size:32px;font-weight:900}
.bi-pay{font-size:18px;font-weight:800;color:#8A5300;padding:4px 0 10px}
.bi-f{font-size:17px;color:#666;text-align:center;border-top:1px dashed #BBB;padding-top:10px}
#review .nav{position:sticky;top:0;z-index:20;background:var(--bg)}
.seg{height:64px!important}.seg button{width:64px!important;height:64px!important}.seg em{font-size:20px!important;min-width:96px!important}
.lrow{font-size:20px!important;padding:14px 16px!important}

#home .tx,#home .tl2 h3{border-radius:0}
.passc{border-radius:20px 20px 6px 6px!important}
#listen{--listen-bg:#F4F7F6;color:var(--tx)!important}#listen .lt .ib,#listen .lt span{color:var(--tx)!important}#listen .lyr{color:var(--tx)!important;font-size:30px!important;min-height:200px!important}#listen .lyr .w{color:rgba(0,0,0,.22)!important}#listen .lyr .w.on{color:#0E5E57!important}
#listen .livebill{background:#fff!important;border:1.5px solid #0E5E57;color:var(--tx)}#listen .lrow span{color:var(--tx3)!important}#listen .lfoot{background:linear-gradient(transparent,#F4F7F6 30%)!important;color:var(--tx)}#listen .lfoot small{color:var(--tx3)!important}#listen .done-btn{background:#0E5E57!important;color:#fff!important}
[data-theme=dark] #listen{--listen-bg:#0B1F1D}[data-theme=dark] #listen .livebill{background:#132826!important}
.pay{flex-direction:row!important;justify-content:flex-start!important;gap:14px!important;padding:0 16px!important;min-height:72px!important}.payrow{grid-template-columns:1fr!important}

.pay.on{border-color:var(--acc)!important;background:var(--acc-soft)!important;color:var(--acc)!important}.pay.u.on{border-color:var(--ud)!important;background:var(--ud-soft)!important;color:var(--ud)!important}

/* ===== round 4: panel-3 fixes + AI reduction ===== */
#review{padding-bottom:220px!important}
.who span,.note,.cell .t span{font-size:18px!important}.note{font-weight:700!important}

const Q=new URLSearchParams(location.search),L=Q.get('lang')||'hinglish',D=T[L],$=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms))

document.body.classList.toggle('hi',L==='hi')
function setTheme(t){document.documentElement.dataset.theme=t;$('#thic').innerHTML=`<use href="#${t==='dark'?'sun':'moon'}"/>`;try{localStorage.setItem('theme',t)}catch(e){}}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
let t0='light';try{t0=localStorage.getItem('theme')||t0}catch(e){};if(Q.get('theme'))t0=Q.get('theme');setTheme(t0)
function paint(){document.querySelectorAll('[data-t]').forEach(e=>{const v=D[e.dataset.t];if(typeof v==='string')e.textContent=v})}
function go(v){view=v;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));scrollTo(0,0);$('#tabbar').style.display=v==='home'||v==='done'?'grid':'none';$("#voicebar").style.display=v==='home'?'flex':'none';$('#cta').style.display=v==='review'?'flex':'none';paint();if(v==='listen')listen();if(v==='review')review()}
const AMT=[92,14,75]
async function listen(){const w=D.said.split(' ');$('#lyr').innerHTML=w.map(x=>`<span class="w">${x}</span>`).join(' ');$('#live').innerHTML='';run=0;$('#run').textContent='₹0'
 const ws=[...document.querySelectorAll('#lyr .w')];for(let i=0;i<ws.length;i++){await wait(230);if(view!=='listen')return;ws[i].classList.add('on');if(i===4||i===6||i===10){const k=i===4?0:i===6?1:2;$('#live').insertAdjacentHTML('beforeend',`<div class="lrow">${D.names[k].replace('?','')} <span>${D.q[k]}</span><b class="num">₹${AMT[k]}</b></div>`.replace(' <span>','<span style="flex:1;padding-left:8px">'));run+=AMT[k];$('#run').textContent='₹'+run}}
 await wait(700);if(view==='listen')go('review')}
function item(i,q){return `<div class="item${q?' q':''}"><div class="a"><b>${D.names[i]}</b><span class="num">₹${AMT[i]}</span></div><div class="s">${D.units[i]}</div>${q?`<div class="seg"><button aria-label="-"><svg width="20" height="20"><use href="#minus"/></svg></button><em>${D.q[i]}</em><button aria-label="+"><svg width="20" height="20"><use href="#plus"/></svg></button></div><div class="ask"><p>${D.ask}</p><div><button class="p">${D.no}</button><button class="y p" onclick="ok()"><svg width="20" height="20"><use href="#check"/></svg>${D.yes}</button></div></div>`:''}</div>`}
function review(){open=true;pay=null;$('#rows').innerHTML=item(0)+item(1,true)+item(2);document.querySelectorAll('.pay').forEach(x=>{x.classList.remove('on');x.disabled=true});state()}
function ok(){open=false;$('#rows').innerHTML=item(0)+item(1).replace('?','')+item(2);document.querySelectorAll('.pay').forEach(x=>x.disabled=false);state();setTimeout(()=>$('.total').scrollIntoView({behavior:'smooth',block:'start'}),60)}
function state(){const n=$('#note');n.className='note'+(pay==='u'?' ud':'');n.textContent=open?D.n0:!pay?D.n1:pay==='u'?D.nU:'';const c=$('#cf');c.disabled=open||!pay;c.textContent=open?D.c0:!pay?D.c1:pay==='u'?D.cU:pay==='p'?D.cP:D.cC}
document.querySelectorAll('.pay').forEach(b=>b.onclick=()=>{if(open)return;pay=b.dataset.p;document.querySelectorAll('.pay').forEach(x=>x.classList.toggle('on',x===b));state()})
function saved(){$('#aft1').textContent=pay==='u'?D.aftU:pay==='p'?D.aftP:D.aftC;$('#aft2').textContent=pay==='u'?'₹2,597':'₹181';go('done');navigator.vibrate&&navigator.vibrate(30)}
paint()
