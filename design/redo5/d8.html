<!doctype html>
<html lang="hi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OmniOS Dukaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Design 1 · clean modern. Apple calm (grouped lists, large titles, system type), PhonePe familiarity (money first, one big action),
   Spotify boldness (heavy type, full-screen "now listening" with the words lit up like lyrics). Light + dark. */
:root{
  --acc:#1ED760; --acc-ink:#000; --acc-soft:rgba(30,215,96,.14);
  --bg:#F2F2F7; --surf:#FFFFFF; --surf2:#F7F7FA; --tx:#0B0B0F; --tx2:#3C3C43; --tx3:#5E5E66; --sep:rgba(60,60,67,.16);
  --ud:#9A5B00; --ud-soft:rgba(154,91,0,.10); --ok:#1F8A4C; --ok-soft:rgba(31,138,76,.12);
  --listen-bg:#111114; --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#121212; --surf:#1F1F1F; --surf2:#2C2C2E; --tx:#FFFFFF; --tx2:#EBEBF5; --tx3:#AEAEB2; --sep:rgba(84,84,88,.6);
  --ud:#FFB547; --ud-soft:rgba(255,181,71,.14); --ok:#4CD47F; --ok-soft:rgba(76,212,127,.14); --acc:#1ED760; --acc-soft:rgba(30,215,96,.18);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--tx);font:500 18px/25px -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Noto Sans Devanagari",system-ui,sans-serif;max-width:440px;margin:0 auto;min-height:100dvh;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{flex:none}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:12px}
.p{transition:transform .12s var(--ease),opacity .12s}.p:active{transform:scale(.96);opacity:.85}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.view{display:none;padding-bottom:120px}.view.on{display:block}

/* header */
.nav{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 0 20px;min-height:60px}
.nav .shop{font-size:17px;font-weight:600;color:var(--tx3)}
.nav .r{display:flex;gap:2px}
.ib{min-width:56px;min-height:56px;border-radius:28px;display:grid;place-items:center;color:var(--tx)}
.ib:active{background:var(--surf2)}
.large{font-size:34px;line-height:41px;font-weight:800;letter-spacing:-.6px;padding:2px 20px 0}

/* hero money */
.hero{padding:18px 20px 6px}
.hero small{display:block;font-size:17px;font-weight:600;color:var(--tx3)}
.hero b{display:block;font-size:60px;line-height:68px;font-weight:800;margin-top:2px}
.hero span{font-size:17px;color:var(--tx3);font-weight:500}
.hero span em{font-style:normal;color:var(--ok);font-weight:700}
.chips{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto}
.chip{flex:1;min-width:0;background:var(--surf);border-radius:16px;padding:12px 14px}
.chip small{display:block;font-size:17px;color:var(--tx3);font-weight:600}
.chip b{display:block;font-size:23px;line-height:30px;font-weight:800}
.chip.u b{color:var(--ud)}

/* colour tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 16px 0}
.tile{border-radius:10px;padding:14px 14px 16px;min-height:118px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:21px;line-height:26px;font-weight:800}.tile .num{font-size:30px;line-height:36px;font-weight:800;margin-top:auto}.tile small{font-size:17px;line-height:22px;opacity:.9;font-weight:600}
.tile.wide{grid-column:1/-1}
.t1{background:#1E7B4C}.t2{background:#2D46B9}.t3{background:#8D5B07}.t4{background:#E8115B}.t5{background:#BA5D07}.t6{background:#503750}
.t3 .num{font-size:40px;line-height:46px;margin-top:4px}
.tbtn{position:absolute;right:12px;bottom:12px;min-height:56px;padding:0 18px;border-radius:28px;background:#fff;color:#000;font-weight:800;font-size:17px}
/* grouped list (Apple) */
.gh{display:flex;justify-content:space-between;align-items:baseline;padding:30px 20px 8px}
.gh h2{font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.3px}
.gh span{font-size:17px;color:var(--acc);font-weight:700}
.group{margin:0 16px;background:var(--surf);border-radius:16px;overflow:hidden}
.cell{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 16px;min-height:72px;position:relative}
.cell+.cell::before{content:"";position:absolute;top:0;left:66px;right:0;height:1px;background:var(--sep)}
.cell.noic+.cell::before,.cell.noic::before{left:16px}
.av{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;background:var(--surf2);color:var(--tx2)}
.av.o{background:var(--acc-soft);color:var(--acc)}
.cell .t{flex:1;min-width:0}
.cell .t b{display:block;font-size:18px;line-height:24px;font-weight:700}
.cell .t span{display:block;font-size:17px;line-height:22px;color:var(--tx3)}
.cell .amt{font-size:20px;font-weight:800;color:var(--ud)}
.pill{min-height:56px;padding:0 16px;border-radius:28px;background:var(--surf2);font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:6px;flex:none}
.pill.acc{background:var(--acc);color:var(--acc-ink)}
.chev{color:var(--tx3)}

/* tab bar + center action (PhonePe-style placement) */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;height:92px;padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--sep);display:grid;grid-template-columns:1fr 1fr 104px 1fr 1fr;align-items:center;z-index:40}
.tab{height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:17px;line-height:20px;font-weight:600;color:var(--tx3)}
.tab.on{color:var(--acc)}
.mic{width:78px;height:78px;margin:-30px auto 0;border-radius:39px;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.5),0 0 0 6px var(--bg)}
.micl{text-align:center;font-size:17px;font-weight:800;color:var(--acc);margin-top:2px}

/* listening: Spotify-lyrics style */
#listen{background:var(--listen-bg);color:#fff;min-height:100dvh}
.lt{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 0 8px}
.lt .ib{color:#fff}
.lt span{font-size:17px;font-weight:700;color:rgba(255,255,255,.7);padding-right:14px}
.lyr{padding:28px 24px 0;font-size:34px;line-height:46px;font-weight:800;letter-spacing:-.6px;min-height:280px}
.lyr .w{color:rgba(255,255,255,.28);transition:color .2s}
.lyr .w.on{color:#fff}
.bars{display:flex;gap:5px;align-items:flex-end;height:36px;padding:0 24px}
.bars i{width:6px;border-radius:3px;background:var(--acc);animation:b .8s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.1s}.bars i:nth-child(3){animation-delay:.2s}.bars i:nth-child(4){animation-delay:.3s}.bars i:nth-child(5){animation-delay:.15s}
@keyframes b{0%,100%{height:8px}50%{height:34px}}
.livebill{margin:22px 16px 0;background:#1C1C1E;border-radius:16px;overflow:hidden}
.lrow{display:flex;justify-content:space-between;padding:12px 16px;font-size:18px;font-weight:700;animation:in .35s var(--ease) both}
.lrow+.lrow{border-top:1px solid rgba(255,255,255,.1)}
.lrow span{color:rgba(255,255,255,.6);font-weight:500}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lfoot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;padding:16px 20px calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,#111114 30%);z-index:40}
.lfoot small{display:block;font-size:17px;color:rgba(255,255,255,.6);font-weight:600}
.lfoot b{font-size:36px;line-height:42px;font-weight:800}
.done-btn{min-height:64px;padding:0 26px;border-radius:32px;background:#fff;color:#000;font-weight:800;font-size:19px;display:inline-flex;align-items:center;gap:8px}

/* review */
.who{display:flex;align-items:center;gap:14px;margin:6px 16px 0;padding:14px 16px;background:var(--surf);border-radius:16px}
.who .av{display:grid;place-items:center;width:48px;height:48px;border-radius:24px;background:var(--acc-soft);color:var(--acc);font-size:20px}
.who b{display:block;font-size:19px;font-weight:800}.who span{display:block;font-size:17px;color:var(--ud);font-weight:600}
.who .t{flex:1}
.item{padding:12px 14px 12px 16px;position:relative}
.item+.item::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.item .a{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item .a b{font-size:19px;font-weight:700}.item .a .num{font-size:19px;font-weight:800}
.item .s{font-size:17px;color:var(--tx3);margin-top:2px}
.item.q{background:var(--acc-soft)}
.q .ask{margin-top:10px}
.q .ask p{font-size:17px;font-weight:700}
.q .ask div{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.q .ask button{min-height:56px;border-radius:28px;font-weight:700;font-size:17px;background:var(--surf);display:flex;align-items:center;justify-content:center;gap:6px}
.q .ask button.y{background:var(--acc);color:#fff}
.seg{display:flex;align-items:center;gap:0;margin-top:8px;background:var(--surf2);border-radius:28px;width:max-content}
.seg button{width:56px;height:56px;display:grid;place-items:center}
.seg em{min-width:72px;text-align:center;font-style:normal;font-weight:800;font-size:18px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 0}
.total span{font-size:20px;font-weight:700;color:var(--tx3)}
.total b{font-size:40px;line-height:48px;font-weight:800}
.payrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 16px 0}
.pay{min-height:84px;border-radius:16px;background:var(--surf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:18px;border:2px solid transparent}
.pay[disabled]{opacity:.4}
.pay.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.pay.u.on{border-color:var(--ud);background:var(--ud-soft);color:var(--ud)}
.note{margin:10px 20px 0;font-size:17px;color:var(--tx3);font-weight:600}
.note.ud{color:var(--ud)}
.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;gap:10px;z-index:40}
.cta .main{flex:1;min-height:64px;border-radius:32px;background:var(--acc);color:#fff;font-weight:800;font-size:18px;padding:0 16px}
.cta .main[disabled]{background:var(--surf2);color:var(--tx3)}
.cta .sm{width:64px;height:64px;border-radius:32px;background:var(--surf);color:var(--acc);display:grid;place-items:center;flex:none}

/* done */
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px 0}
.okc{width:96px;height:96px;border-radius:48px;background:var(--ok);color:#fff;display:grid;place-items:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.ok h1{font-size:30px;line-height:36px;font-weight:800;margin-top:18px;letter-spacing:-.4px}
.ok .num{font-size:52px;line-height:60px;font-weight:800;margin-top:4px}
.ok p{font-size:18px;color:var(--tx3);margin-top:4px}
.after{margin:22px 16px 0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 16px 0}
.acts .pill{width:100%;justify-content:center;min-height:60px;border-radius:30px}
body.hi .large,body.hi .lyr,body.hi .ok h1{line-height:1.45}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mic" viewBox="0 0 24 24"><rect class="ic" x="9" y="2.5" width="6" height="12" rx="3"/><path class="ic" d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
  <symbol id="home" viewBox="0 0 24 24"><path class="ic" d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"/></symbol>
  <symbol id="bill" viewBox="0 0 24 24"><path class="ic" d="M6 2.5h12v19l-3-1.6-3 1.6-3-1.6-3 1.6zM9 8h6M9 12h6"/></symbol>
  <symbol id="box" viewBox="0 0 24 24"><path class="ic" d="M20.5 7.5 12 3 3.5 7.5v9L12 21l8.5-4.5zM3.5 7.5 12 12l8.5-4.5M12 12v9"/></symbol>
  <symbol id="book" viewBox="0 0 24 24"><path class="ic" d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5zM5 19.5A1.5 1.5 0 0 0 6.5 21H19"/></symbol>
  <symbol id="qr" viewBox="0 0 24 24"><path class="ic" d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM14 20h2M20 14v2"/></symbol>
  <symbol id="moon" viewBox="0 0 24 24"><path class="ic" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="sun" viewBox="0 0 24 24"><circle class="ic" cx="12" cy="12" r="4"/><path class="ic" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24"><circle class="ic" cx="12" cy="12" r="3"/><path class="ic" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3.1 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path class="ic" d="M6 9l6 6 6-6"/></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path class="ic" d="M9 6l6 6-6 6"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path class="ic" d="M5 12.5l4.5 4.5L19 7.5" style="stroke-width:2.8"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path class="ic" d="M12 5v14M5 12h14" style="stroke-width:2.4"/></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><path class="ic" d="M5 12h14" style="stroke-width:2.4"/></symbol>
  <symbol id="cash" viewBox="0 0 24 24"><rect class="ic" x="2.5" y="6" width="19" height="12" rx="2.5"/><circle class="ic" cx="12" cy="12" r="2.5"/></symbol>
  <symbol id="wa" viewBox="0 0 24 24"><path class="ic" d="M7.9 20A9 9 0 1 0 4 16.1L2.5 21.5z"/></symbol>
  <symbol id="undo" viewBox="0 0 24 24"><path class="ic" d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
</svg>

<!-- HOME -->
<section class="view on" id="home">
  <div class="nav"><span class="shop" data-t="area"></span><div class="r"><button class="ib p" onclick="toggleTheme()" aria-label="Theme"><svg width="24" height="24" id="thic"><use href="#moon"/></svg></button><button class="ib p" aria-label="QR"><svg width="24" height="24"><use href="#qr"/></svg></button><button class="ib p" aria-label="Settings"><svg width="24" height="24"><use href="#gear"/></svg></button></div></div>
  <h1 class="large" data-t="shop"></h1>
  <div class="hero"><small data-t="today"></small><b class="num">₹14,218</b><span><span data-t="bills"></span> · <em data-t="vs"></em></span></div>
  <div class="tiles">
  <div class="tile t1"><b data-t="cash"></b><span class="num">₹9,642</span></div>
  <div class="tile t2"><b>UPI</b><span class="num">₹3,456</span></div>
  <div class="tile t3 wide"><b data-t="collect"></b><span class="num">₹32,484</span><small data-t="lenan2"></small><button class="tbtn p" data-t="remindall"></button></div>
  <div class="tile t4"><b data-t="o1"></b><small data-t="o1s"></small></div>
  <div class="tile t5"><b data-t="l1"></b><small data-t="l1s"></small></div>
  <div class="tile t6 wide"><b data-t="cnt"></b><small data-t="c1s"></small></div>
 </div>
</section>

<!-- LISTEN -->
<section class="view" id="listen">
  <div class="lt"><button class="ib p" onclick="go('home')" aria-label="Close"><svg width="28" height="28"><use href="#down"/></svg></button><span data-t="newbill"></span></div>
  <div class="lyr" id="lyr"></div>
  <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="livebill" id="live"></div>
  <div class="lfoot"><div><small data-t="sofar"></small><b class="num" id="run">₹0</b></div><button class="done-btn p" onclick="go('review')"><svg width="20" height="20"><use href="#check"/></svg><span data-t="stop"></span></button></div>
</section>

<!-- REVIEW -->
<section class="view" id="review">
  <div class="nav"><button class="ib p" onclick="go('home')" aria-label="Back" style="margin-left:-12px"><svg width="26" height="26" style="transform:rotate(90deg)"><use href="#down"/></svg></button><span class="shop" data-t="billno"></span></div>
  <h1 class="large" data-t="check"></h1>
  <div class="who"><span class="av">SJ</span><div class="t"><b data-t="sharma"></b><span data-t="old"></span></div><button class="pill p" data-t="change"></button></div>
  <div class="gh" style="padding-top:20px"><h2 data-t="items"></h2></div>
  <div class="group" id="rows"></div>
  <div class="total"><span data-t="total"></span><b class="num">₹181</b></div>
  <div class="gh" style="padding-top:18px"><h2 data-t="how"></h2></div>
  <div class="payrow">
    <button class="pay p" data-p="c"><svg width="28" height="28"><use href="#cash"/></svg><span data-t="cash"></span></button>
    <button class="pay p" data-p="p"><svg width="28" height="28"><use href="#qr"/></svg><span>UPI</span></button>
    <button class="pay u p" data-p="u"><svg width="28" height="28"><use href="#book"/></svg><span data-t="udhaar"></span></button>
  </div>
  <p class="note" id="note"></p>
</section>

<!-- DONE -->
<section class="view" id="done">
  <div class="ok"><div class="okc"><svg width="48" height="48"><use href="#check"/></svg></div><h1 data-t="saved"></h1><span class="num">₹181</span><p data-t="meta"></p></div>
  <div class="group after"><div class="cell noic"><div class="t"><b id="aft1"></b><span data-t="aftsub"></span></div><span class="amt num" id="aft2"></span></div></div>
  <div class="acts"><button class="pill p"><svg width="22" height="22" style="color:var(--ok)"><use href="#wa"/></svg><span>WhatsApp</span></button><button class="pill p" onclick="go('home')"><svg width="22" height="22"><use href="#undo"/></svg><span data-t="undo"></span></button></div>
</section>

<nav class="tabbar" id="tabbar">
  <button class="tab on p" onclick="go('home')"><svg width="26" height="26"><use href="#home"/></svg><span data-t="tHome"></span></button>
  <button class="tab p"><svg width="26" height="26"><use href="#bill"/></svg><span data-t="tBill"></span></button>
  <div><button class="mic p" id="mic" onclick="go('listen')" aria-label="Speak"><svg width="34" height="34"><use href="#mic"/></svg></button><div class="micl" data-t="bolo"></div></div>
  <button class="tab p"><svg width="26" height="26"><use href="#box"/></svg><span data-t="tMaal"></span></button>
