<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFA51B">
<title>OmniOS Dukaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Redo #4 · v3 "MRP box, full flow". Packet language end to end:
   haldi packet field · maroon printed band with the inkjet batch code (bill no · date · time) ·
   money inside ruled MRP boxes with "/-" · bill lines as the ruled table printed on every packet.
   Two radii (16 surfaces/buttons, 10 boxes). One border weight for boxes (2px ink), hairlines for rows. */
:root{
  --y:#EFA51B; --y-50:#FFF3D9; --y-ink:#3D2700;
  --mr:#7A1530; --mr2:#64102A; --mr-ink:#FFE6AE;
  --ink:#16120A; --ink2:#28241A; --mute:#575041; --line:#E2DED4; --line2:#ECE9E2;
  --bg:#F2F0E9; --paper:#FFFFFF;
  --gr:#0E6A3B; --ud:#573000; --ud-50:#FBEEDB;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:500 18px/26px "Mukta",system-ui,sans-serif;max-width:440px;margin:0 auto;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{flex:none}
::selection{background:var(--y);color:var(--ink)}
:focus-visible{outline:3px solid var(--mr);outline-offset:2px;border-radius:14px}
.p{transition:transform .12s var(--ease),background-color .15s,border-color .15s}.p:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.fig{font-family:"Baloo 2",sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.fig .s{font-size:max(.5em,14px);font-weight:700;margin-left:2px}
.view{display:none;padding-bottom:140px}
#done{padding-bottom:32px}.view.on{display:block}

/* packet field + printed batch band (the signature) */
.field{background:var(--y);padding:6px 16px 18px}
.batch{background:var(--mr);color:var(--mr-ink);font-family:"Mukta";font-weight:700;font-size:18px;line-height:24px;letter-spacing:.6px;padding:11px 16px;white-space:nowrap;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;min-height:60px}
.shop{flex:1;min-width:0}
.shop b{display:block;font-family:"Baloo 2";font-weight:800;font-size:24px;line-height:28px;padding-top:4px}
.shop span{display:block;font-size:17px;line-height:22px;color:var(--y-ink);font-weight:600}
.tool{min-height:56px;min-width:58px;padding:2px 8px 0;border-radius:14px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;line-height:20px;font-weight:700}
.tool:active{background:rgba(22,18,10,.1)}

.mrp{border:2px solid var(--ink);border-radius:14px;margin-top:8px}
.mrp-top{padding:10px 14px 6px}
.mrp-top small{display:flex;justify-content:space-between;font-size:17px;line-height:22px;font-weight:700;color:var(--y-ink)}
.amt{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.amt b{font-size:58px;line-height:62px}
.amt span{font-size:19px;font-weight:700}
.cols{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink)}
.cols div{padding:8px 12px 10px}
.cols div+div{border-left:2px solid var(--ink)}
.cols small{display:block;font-size:17px;line-height:22px;font-weight:700;color:var(--y-ink)}
.cols b{display:block;font-size:26px;line-height:30px}
.due{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:2px solid var(--ink);padding:10px 10px 10px 14px;min-height:56px;text-align:left}
.due span{font-size:18px;font-weight:700}
.due b{font-size:24px;line-height:28px}
.due .r{display:flex;align-items:center;gap:6px}

/* work list */
.sec{margin:30px 18px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-family:"Baloo 2";font-size:24px;line-height:30px;font-weight:800}
.sec span{font-size:17px;color:var(--mute);font-weight:600}
.card{margin:0 14px;background:var(--paper);border-radius:14px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px;min-height:82px}
.row+.row{border-top:1px solid var(--line2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:19px;line-height:25px;font-weight:700}
.row .t span{display:block;font-size:17px;line-height:22px;color:var(--ink2);margin-top:2px}
.row .t .ud{color:var(--ud);font-weight:700}
.btn{min-height:56px;padding:0 14px;border-radius:14px;font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:none;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.btn.fill{background:var(--ink);color:#fff}
.btn.wa{background:var(--gr);border-color:var(--gr);color:#fff}
.btn .g{color:var(--gr)}
.row .btn{min-width:132px}

/* bottom bar: tabs + big speak key */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;height:88px;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 124px 1fr 1fr;align-items:center;padding:0 4px env(safe-area-inset-bottom);z-index:40}
.tab{height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:17px;line-height:20px;font-weight:600;color:var(--mute)}
.tab.on{color:var(--ink);font-weight:800}
.speak{height:72px;margin:0 2px;border-radius:14px;background:var(--mr);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:"Baloo 2";font-size:20px;line-height:22px;font-weight:800}
.speak svg{color:var(--y)}
.nav.flow .tab{visibility:hidden}
.nav.gone{display:none}
.again{min-height:56px;padding:0 16px;border-radius:14px;background:var(--mr);color:#fff;white-space:nowrap;font-weight:800;font-size:18px;display:none;align-items:center;gap:8px}
.listen.done .again{display:none}
.run{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--paper);border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));gap:12px;align-items:center!important;z-index:30;display:flex;justify-content:space-between;align-items:baseline;z-index:30}
.run span{font-size:18px;font-weight:700;color:var(--ink2);flex:1;text-align:right}.run b{font-size:34px;line-height:38px}
.run .stop{display:inline-flex}.run .stop span{color:#fff;flex:none;font-weight:800}
.listen .lh>.stop{display:none!important}
.nav.hear .speak{visibility:hidden}

/* bill: listening field */
.bt{display:flex;justify-content:space-between;align-items:center}
.back{min-height:56px;display:inline-flex;align-items:center;gap:6px;padding:0 8px 0 0;font-weight:700}
.listen{border:2px solid var(--ink);border-radius:14px;padding:10px 12px 12px 14px;margin-top:4px}
.lh{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}
.backc{display:none;min-height:56px;min-width:56px;align-items:center;gap:6px;font-weight:700}
#billv.done .field{position:sticky;top:0;z-index:25;padding:6px 12px 6px;box-shadow:0 6px 14px -10px rgba(22,18,10,.5)}
#billv.done .bt,#billv.done .listen p{display:none}
#billv.done .batch{position:sticky;top:68px;z-index:24;box-shadow:0 1px 0 rgba(0,0,0,.25)}
#billv.done .field{height:68px}
#billv.done .listen{border:0;padding:0;margin:0}
#billv.done .backc{display:inline-flex}
#billv.done .lh .st{flex:1}
#billv.payst .stp{display:none}
#billv.payst .cust{display:none}

.dt>span:last-child{margin-left:auto}
.qty{display:none;font-weight:800;font-size:20px;min-height:44px;align-items:center}
#billv.payst .qty{display:none}
.ghost{height:60px;border-top:1.5px dashed var(--line);margin:0 14px}
.lh .st{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.wave{display:flex;gap:4px;align-items:center;height:30px}
.wave i{width:6px;border-radius:3px;background:var(--mr);animation:w .8s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes w{0%,100%{height:8px}50%{height:34px}}
.wave{height:36px}
.listen.done .wave{display:none}
.okdot{display:none;width:30px;height:30px;border-radius:50%;background:var(--mr);color:var(--y)!important;color:#fff;place-items:center}
.listen.done .okdot{display:grid}
.stop{min-height:56px;padding:0 18px;border-radius:14px;background:var(--mr);color:#fff;font-weight:800;font-size:18px;display:inline-flex;align-items:center;gap:8px}
.listen.done .stop{display:none}
.listen p{font-size:26px;line-height:36px;font-weight:700;margin-top:6px;min-height:68px}
.listen p mark{background:none;color:inherit;box-shadow:inset 0 -4px 0 var(--mr)}

.cust{margin:14px 14px 0;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;background:var(--paper);border-radius:14px;opacity:0;transition:opacity .3s}
.cust.on{opacity:1}
.cust .t{flex:1}.cust b{display:block;font-size:20px;line-height:26px;font-weight:800}.cust span{display:block;font-size:18px;line-height:22px;color:var(--ud);font-weight:700}

/* bill as the ruled table printed on packets */
.tbl{margin:12px 14px 0;background:var(--paper);border:2px solid var(--ink);border-radius:14px;overflow:hidden}
.th{display:flex;justify-content:space-between;padding:8px 14px;border-bottom:6px solid var(--ink);font-family:"Baloo 2";font-weight:800;font-size:18px;line-height:22px}
.tr{padding:10px 12px 10px 14px;animation:in .35s var(--ease) both}
.tr+.tr{border-top:1px solid var(--ink)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tr .a{display:flex;justify-content:space-between;align-items:flex-start}
.tr .a b{font-size:21px;line-height:28px;font-weight:700}
.tr .a .fig{font-size:24px}
.tr .c{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.tr .c>span{font-size:18px;line-height:22px;color:#3B3427;font-weight:700}
.tr .nm span{display:block;font-size:18px;line-height:22px;color:#3B3427;font-weight:700}
.tr .c span{font-size:18px;color:#3B3427;font-weight:700}
.stp{display:flex;align-items:center;height:56px;border:2px solid var(--line);border-radius:14px}
.stp button{width:52px;height:52px;display:grid;place-items:center}
.stp em{width:76px;text-align:center;white-space:nowrap;font-style:normal;font-weight:700;font-size:19px}
.tr.q{background:var(--y-50)}
.ask{margin-top:10px;padding-top:10px;border-top:1.5px dashed #D9A84A}
.ask p{font-size:18px;font-weight:700;color:var(--y-ink)}
.ask div{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ask button{min-height:56px;border-radius:14px;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:#fff}
.ask button.y{background:var(--mr);border-color:var(--mr);color:#fff}
.tt{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px 10px;border-top:6px solid var(--ink)}
.tt span{font-family:"Baloo 2";font-weight:800;font-size:20px}
.tt small{font-size:17px;font-weight:700;color:var(--mute);margin-left:6px}
.tt b{font-size:34px;line-height:40px}
.empty{padding:16px 14px;font-size:18px;color:var(--mute);min-height:84px}
.empty+.empty{border-top:1px solid var(--line)}

.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--paper);border-top:1px solid var(--line);border-radius:14px 16px 0 0;box-shadow:0 -10px 24px -16px rgba(22,18,10,.4);padding:12px 14px calc(16px + env(safe-area-inset-bottom));z-index:30;display:none}
.dock.on{display:block;animation:up .3s var(--ease) both}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.why{width:100%;min-height:64px;border-radius:14px;background:var(--y-50);font-weight:800;font-size:18px;color:var(--y-ink);display:flex;align-items:center;justify-content:center;gap:8px}
.hint{min-height:64px;margin-top:10px;border-radius:14px;background:var(--y-50);border:1.5px dashed #D9A84A;color:var(--y-ink)!important;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:18px;color:var(--ink2)}
.pq{font-size:18px;font-weight:800;margin:0 2px 8px}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay{height:72px;border-radius:14px;border:2px solid #CFCAB9;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-weight:800;font-size:18px;line-height:22px}
.pay small{font-size:17px;font-weight:600;color:var(--ud);line-height:20px}
.pay{position:relative}
.pay.on{border:3px solid var(--mr);background:var(--y)}
.pay.on::after{content:"✓";position:absolute;top:-10px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--mr);color:var(--y);font-size:17px;font-weight:800;display:grid;place-items:center}
.pay.u.on{background:var(--ud-50);color:var(--ud)}
.math{margin-top:8px;padding:10px 16px;gap:2px;flex-wrap:wrap;border-radius:14px;background:var(--ud-50);color:var(--ud);font-weight:700;font-size:18px;display:flex;justify-content:space-between}
.save{margin-top:10px;width:100%;min-height:64px;border-radius:14px;background:var(--mr);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--mr)}
.save svg{color:var(--y)}
.save[disabled]{background:var(--y-50);color:var(--ink);border-style:dashed;font-size:18px}

/* saved */
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:8px 0 0}
.ok i{width:116px;height:116px;border-radius:50%;background:var(--mr);color:var(--y);box-shadow:inset 0 0 0 6px var(--mr),inset 0 0 0 9px var(--y);position:relative;flex-direction:column;gap:0;font-family:"Baloo 2";font-weight:800;font-size:18px;line-height:20px;transform:rotate(-10deg);animation:seal .55s cubic-bezier(.34,1.5,.64,1) both .1s;display:grid;place-items:center}
.ok b{display:block;font-family:"Baloo 2";font-size:26px;line-height:30px;font-weight:800;padding-top:4px}
.ok span{display:block;font-size:18px;color:var(--y-ink);font-weight:700}
.sv .tbl{margin-top:14px}.sv .tr{padding-top:7px;padding-bottom:7px}
.sv .tr{animation:none}
.who{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--ink);font-weight:800;font-size:19px}
.tag{margin:0 14px 12px;border:2px solid var(--ud);border-radius:14px;background:var(--ud-50);color:var(--ud);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:18px;line-height:24px;animation:pop .5s var(--ease) both .2s}
.tag span:first-child{flex:1}.tag .fig{white-space:nowrap;font-size:22px}
.tag.c{border-color:var(--gr);background:#E4F2EA;color:var(--gr)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.next{margin:18px 14px 0;width:calc(100% - 28px);min-height:64px;border-radius:14px;background:var(--mr);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px}.next svg{color:var(--y)}
.acts{margin:10px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .btn{width:100%;min-height:60px;white-space:nowrap}
.undo{margin:12px 14px 0;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;background:var(--paper);border-radius:14px;font-size:18px!important;color:#3B3427!important;font-weight:600;font-size:17px;line-height:22px;color:var(--ink2)}
.undo span{flex:1}
.note{margin:26px 18px 0;text-align:center;font-size:17px;color:var(--mute)}
.sv .batch{animation:print .9s steps(24) both .15s}
@keyframes print{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.ok i.seal{display:flex;align-items:center;justify-content:center}.ok i.seal::after{content:"";position:absolute;inset:-4px 2px 4px -2px;border-radius:50%;border:2px solid var(--mr);opacity:.45}
.ok i.seal span{display:block;color:var(--y)!important;font-size:25px!important;line-height:30px!important;letter-spacing:1px;line-height:26px;font-weight:800;padding-top:6px}
.tag span{white-space:nowrap}.tag span:first-child{font-size:18px}
@keyframes seal{0%{transform:rotate(-10deg) scale(2.2);opacity:0}70%{transform:rotate(-10deg) scale(.92);opacity:1}100%{transform:rotate(-10deg) scale(1)}}
.dt{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.dtl{flex:1;text-align:right;white-space:nowrap;font-size:18px;font-weight:700;color:var(--ink2)}
.mini{min-height:56px;padding:0 14px;border-radius:14px;border:2px solid var(--mr);color:var(--mr);font-weight:800;font-size:18px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dt span{font-size:18px;font-weight:700;color:var(--ink2)}.dt b{font-size:30px;line-height:34px}.dt small{font-size:17px;color:var(--mute);font-weight:700;margin-right:6px}
body.hi .ok i.seal span{font-size:32px!important;letter-spacing:0}
body.hi .tag span:first-child{font-size:20px}body.hi .undo span{font-size:19px}
body.hi .pay{font-size:20px}
body.hi .batch{font-family:"Mukta";font-weight:700;letter-spacing:0}
body.hi .shop b,body.hi .sec h2,body.hi .ok b{line-height:1.35}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></symbol>
  <symbol id="qr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="bill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h14v20l-3.5-2-3.5 2-3.5-2L5 22z"/><path d="M9 7h6M9 11h6M9 15h3"/></symbol>
  <symbol id="box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
  <symbol id="book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 0 1 3 3v14H7a3 3 0 0 1-3-3z"/><path d="M18 21h2V6M8 9h6M8 13h4"/></symbol>
  <symbol id="wa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></symbol>
