<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2A7A">
<title>OmniOS Dukaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;600;700;800&family=Teko:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Redo #4 · v1 "Aaj ka panna": the shop-wall tear-off date calendar. Each day is one page; today's hisaab is that page.
   World lends: calendar-header indigo, white sheet, heavy condensed numerals (Teko), perforated tear edge. Layout + controls stay standard. */
:root{
  --in:#1F2A7A; --in2:#2B389A; --in-ink:#C9CEF2; --in-50:#E9EBF8;
  --mg:#F2A814; --mg-50:#FFF4D9; --mg-ink:#6A4500;
  --ver:#C8381F;
  --bg:#EEF0F6; --paper:#FFFFFF; --ink:#12162B; --ink2:#363B57; --line:#DEE1EC; --line2:#ECEEF5;
  --ud:#87520A; --ud-50:#FCF0DC; --ok:#17784A; --ok-50:#E4F4EB;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:500 18px/26px "Mukta",system-ui,sans-serif;max-width:440px;margin:0 auto;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg{flex:none}
::selection{background:var(--mg-50);color:var(--ink)}
:focus-visible{outline:3px solid var(--mg);outline-offset:2px;border-radius:12px}
.p{transition:transform .12s var(--ease),background-color .15s}.p:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.num{font-family:"Teko",sans-serif;font-weight:600;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.view{display:none;padding-bottom:118px}.view.on{display:block}

/* ---------- shell header ---------- */
.top{background:var(--in);color:#fff;padding:10px 16px 74px}
.top-row{display:flex;align-items:center;gap:10px;min-height:56px}
.shop{flex:1;min-width:0}
.shop b{display:block;font-size:21px;line-height:28px;font-weight:800}
.shop span{display:block;font-size:17px;line-height:22px;color:var(--in-ink)}
.hb{min-height:58px;min-width:62px;padding:4px 8px 2px;border-radius:14px;background:rgba(255,255,255,.1);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:15px;line-height:18px;font-weight:600}
.hb:active{background:rgba(255,255,255,.18)}

/* ---------- signature: today's page ---------- */
.pad{position:relative;margin:-60px 14px 0}
.pad::before,.pad::after{content:"";position:absolute;left:10px;right:10px;height:20px;bottom:-7px;background:#F9FAFD;border-radius:0 0 16px 16px;box-shadow:0 2px 4px -2px rgba(18,22,43,.18);z-index:0}
.pad::after{left:20px;right:20px;bottom:-14px;background:#F2F4FA}
.sheet{position:relative;z-index:1;background:var(--paper);border-radius:18px;box-shadow:0 10px 24px -12px rgba(18,22,43,.28),0 1px 0 var(--line);overflow:hidden}
.sh-hd{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--in-50);font-size:17px;font-weight:700;color:var(--in)}
.sh-hd .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ver);margin-right:8px;vertical-align:2px}
.sh-main{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:6px 16px 8px;align-items:center}
.date{font-size:92px;line-height:78px;padding-top:12px;color:var(--ink);border-right:1px solid var(--line2);padding-right:16px}
.sale small{display:block;font-size:17px;line-height:22px;color:var(--ink2);font-weight:600}
.sale b{display:block;font-size:52px;line-height:50px;padding-top:6px;color:var(--in)}
.sale .vs{font-size:17px;color:var(--ok);font-weight:700}
.split{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line2)}
.split div{padding:10px 12px 12px;text-align:left}
.split div+div{border-left:1px solid var(--line2)}
.split small{display:block;font-size:17px;line-height:22px;color:var(--ink2);font-weight:600}
.split b{font-size:28px;line-height:30px;padding-top:3px;display:block}
.split .u small,.split .u b{color:var(--ud)}
.tear{height:14px;position:relative;background:var(--paper)}
.tear::before{content:"";position:absolute;left:14px;right:14px;top:6px;border-top:2px dashed var(--line)}
.tear::after{content:"";position:absolute;left:-7px;right:-7px;top:0;height:14px;background:radial-gradient(circle at 7px 7px,var(--bg) 6.5px,transparent 7px) 0 0/100% 14px no-repeat,radial-gradient(circle at calc(100% - 7px) 7px,var(--bg) 6.5px,transparent 7px) 0 0/100% 14px no-repeat}
.streak{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 14px;font-size:17px;color:var(--ink2);font-weight:600}
.streak b{color:var(--ink)}
.days{display:flex;gap:4px;align-items:flex-end;height:30px}
.days i{width:9px;border-radius:3px 3px 1px 1px;background:var(--line)}
.days i.t{background:var(--in)}

/* ---------- work list ---------- */
.h2{display:flex;justify-content:space-between;align-items:baseline;margin:34px 18px 10px}
.h2 h2{font-size:22px;line-height:28px;font-weight:800}
.h2 span{font-size:17px;color:var(--ink2);font-weight:600}
.list{margin:0 14px;background:var(--paper);border-radius:18px;box-shadow:0 1px 0 var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;min-height:76px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line2)}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--in-50);color:var(--in)}
.tile.u{background:var(--ud-50);color:var(--ud)}.tile.m{background:var(--mg-50);color:var(--mg-ink)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:19px;line-height:24px;font-weight:700}
.row .t span{display:block;font-size:17px;line-height:22px;color:var(--ink2);margin-top:2px}
.badge{min-width:30px;height:30px;padding:0 8px;border-radius:15px;background:var(--ver);color:#fff;font-size:17px;font-weight:800;display:grid;place-items:center}
.rbtn{min-height:56px;padding:0 14px;border-radius:14px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:6px;flex:none}
.rbtn.wa{border:1.5px solid #9FD3B4;color:var(--ok);background:#fff}
.rbtn.go{background:var(--in);color:#fff}
.chev{width:22px;height:22px;color:var(--ink2)}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 100px 1fr 1fr;height:84px;padding-bottom:env(safe-area-inset-bottom);z-index:40}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:16px;font-weight:600;color:var(--ink2)}
.tab.on{color:var(--in);font-weight:800}
.tab.on svg{stroke-width:2.4}
.mic{display:flex;flex-direction:column;align-items:center}
.mic button{width:70px;height:70px;margin-top:-24px;border-radius:22px;background:var(--in);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(31,42,122,.55),0 0 0 5px var(--paper)}
.mic span{font-size:16px;font-weight:800;color:var(--in);margin-top:2px}
.nav.flow .tab{visibility:hidden}

/* ---------- bill ---------- */
.bhd{background:var(--in);color:#fff;padding:6px 12px 18px}
.bk{min-height:56px;display:inline-flex;align-items:center;gap:6px;color:var(--in-ink);font-weight:600;padding:0 6px}
.bhd .ttl{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px}
.bhd .ttl b{font-size:24px;line-height:30px;font-weight:800}
.bhd .ttl span{font-size:17px;color:var(--in-ink)}
.heard{margin:12px 6px 0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.09);min-height:84px}
.heard .w{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:var(--mg)}
.heard p{font-size:19px;line-height:27px;color:#fff;margin-top:4px}
.bars{display:flex;gap:3px;align-items:center;height:18px}.bars i{width:3px;border-radius:2px;background:var(--mg);animation:b .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.12s}.bars i:nth-child(3){animation-delay:.24s}.bars i:nth-child(4){animation-delay:.36s}.bars i:nth-child(5){animation-delay:.48s}
@keyframes b{0%,100%{height:5px}50%{height:18px}}
.heard.done .bars{display:none}
.cust{margin:14px 14px 0;background:var(--paper);border-radius:18px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 0 var(--line);opacity:0;transform:translateY(6px);transition:all .35s var(--ease)}
.cust.on{opacity:1;transform:none}
.cust .t{flex:1}.cust b{display:block;font-size:20px;line-height:26px;font-weight:800}
.cust span{display:block;font-size:17px;line-height:22px;color:var(--ud);font-weight:600}
.cust .rbtn{border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.lines{margin:12px 14px 0;background:var(--paper);border-radius:18px;box-shadow:0 1px 0 var(--line);overflow:hidden}
.ln{padding:14px 14px 14px 16px;animation:in .4s var(--ease) both}
.ln+.ln{border-top:1px solid var(--line2)}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.ln .a{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ln .a b{font-size:20px;line-height:26px;font-weight:700}
.ln .a .num{font-size:30px;line-height:28px}
.ln .c{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.ln .c span{font-size:17px;color:var(--ink2)}
.stp{display:flex;align-items:center;height:56px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.stp button{width:54px;height:54px;display:grid;place-items:center;color:var(--in)}
.stp em{min-width:62px;text-align:center;font-style:normal;font-weight:700;font-size:19px}
.ln.q{background:var(--mg-50)}
.ln.q .a b{color:var(--mg-ink)}
.ask{margin-top:12px;padding-top:12px;border-top:1px dashed #E8C774}
.ask p{font-size:18px;font-weight:700;color:var(--mg-ink)}
.ask div{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ask button{min-height:56px;border-radius:14px;font-weight:700;font-size:18px;border:1.5px solid #E8C774;background:#fff;color:var(--mg-ink);display:flex;align-items:center;justify-content:center;gap:8px}
.ask button.y{background:var(--in);border-color:var(--in);color:#fff}
.wait{margin:12px 14px 0;border:2px dashed var(--line);border-radius:18px;height:76px;display:flex;align-items:center;padding:0 16px;gap:12px;color:var(--ink2);font-size:17px}
.wait i{flex:1;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line2) 25%,#F7F8FC 50%,var(--line2) 75%) 0 0/200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -12px 30px -14px rgba(18,22,43,.3);padding:12px 14px 128px;z-index:30;display:none}
.dock.on{display:block;animation:up .35s var(--ease) both}
@keyframes up{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.tot span{font-size:18px;font-weight:700;color:var(--ink2)}
.tot b{font-size:46px;line-height:44px;color:var(--ink)}
.why{margin-top:8px;min-height:56px;width:100%;border-radius:14px;background:var(--mg-50);color:var(--mg-ink);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px}
.payq{font-size:17px;font-weight:700;color:var(--ink2);margin:8px 4px 8px}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay{min-height:64px;border-radius:16px;font-weight:800;font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:22px;padding:6px}
.pay small{font-size:16px;font-weight:600;opacity:.85}
.pay.c{background:var(--in);color:#fff}
.pay.up{background:var(--in-50);color:var(--in)}
.pay.u{grid-column:1/-1;background:var(--ud-50);color:var(--ud);flex-direction:row;gap:10px;justify-content:space-between;padding:0 18px}
.pay.u small{opacity:1}

/* ---------- saved: the entry lands on today's page ---------- */
.done-top{background:var(--in);color:#fff;padding:14px 18px 74px}
.done-top .ok{display:flex;align-items:center;gap:12px}
.done-top .ok i{width:44px;height:44px;border-radius:50%;background:var(--mg);color:var(--in);display:grid;place-items:center}
.done-top b{font-size:24px;line-height:30px;font-weight:800}
.done-top span{display:block;font-size:17px;color:var(--in-ink)}
.bump{animation:bump .9s var(--ease) both .25s}
@keyframes bump{0%{color:var(--in)}30%{color:var(--ok);transform:scale(1.05)}100%{color:var(--in);transform:none}}
.slip{margin:26px 14px 0;background:var(--paper);border-radius:18px;box-shadow:0 1px 0 var(--line);padding:14px 16px}
.slip .a{display:flex;justify-content:space-between;align-items:baseline}
.slip .a b{font-size:20px;font-weight:800}.slip .a .num{font-size:34px;line-height:30px}
.slip ul{list-style:none;padding:8px 0 0;margin:8px 0 0;border-top:1px dashed var(--line)}
.slip li{display:flex;justify-content:space-between;font-size:18px;line-height:32px;color:var(--ink2)}
.slip li b{color:var(--ink);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 12px;border-radius:10px;font-size:17px;font-weight:700;background:var(--ud-50);color:var(--ud)}
.tag.c{background:var(--ok-50);color:var(--ok)}
.acts{margin:14px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{min-height:60px;border-radius:16px;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px}
.act.wa{background:var(--ok);color:#fff}
.act.ln{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.undo{margin:12px 14px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 16px;border-radius:16px;border:1.5px dashed var(--line);font-size:17px;color:var(--ink2)}
.undo .act{min-height:56px;padding:0 14px;flex:none}
.note{margin:28px 18px 0;text-align:center;font-size:15px;color:var(--ink2)}
body.hi .date,body.hi .num{letter-spacing:0}
body.hi h2,body.hi b{line-height:1.4}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="bill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2h14v20l-3.5-2-3.5 2-3.5-2L5 22z"/><path d="M9 7h6M9 11h6M9 15h3"/></symbol>
  <symbol id="box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
  <symbol id="book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 0 1 3 3v14H7a3 3 0 0 1-3-3z"/><path d="M18 21h2V6M8 9h6M8 13h4"/></symbol>
  <symbol id="bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 14H5z"/><path d="M9 7a3 3 0 0 1 6 0"/></symbol>
  <symbol id="count" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></symbol>

  <symbol id="wa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></symbol>
  <symbol id="back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>

</svg>

<!-- ================= HOME ================= -->
<section class="view on" id="home">
  <header class="top">
    <div class="top-row">
      <div class="shop"><b data-t="shop"></b><span data-t="area"></span></div>
      <button class="hb p"><svg width="22" height="22"><use href="#qr"/></svg>QR</button>
      <button class="hb p" aria-label="Settings"><svg width="22" height="22"><use href="#gear"/></svg><span data-t="set"></span></button>
    </div>
  </header>

  <div class="pad">
    <div class="sheet">
      <div class="sh-hd"><span><span class="dot"></span><span data-t="day"></span></span><span data-t="month"></span></div>
      <div class="sh-main">
        <div class="date num">24</div>
